// (ATIVO só pro joey agora — é o único cardápio no ar). Identidade = nome/telefone do checkout (clienteData).
const SCORE_MAX = 500;                  // teto anti-trapaça — fácil de ajustar (validado também nas Firestore Rules)
const RANKING_COL = 'ranking_cobrinha';
function _mesAnoAtual() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function _mesNome() { return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][new Date().getMonth()]; }
function _telDigits() { return String(clienteData?.tel || '').replace(/\D/g, ''); }
function _telMasc(t) { const d = String(t || '').replace(/\D/g, ''); return d.length >= 4 ? '••••' + d.slice(-4) : ''; }
function _escG(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let _snakeAtivo = null; // { parar } da partida em andamento (limpeza ao fechar/recomeçar)
// Teardown IDEMPOTENTE — seguro de chamar a qualquer hora (abrir/fechar/recomeçar/perder foco).
// Garante que NUNCA sobre loop (setInterval) ou listener órfão — a causa do travamento ao sair e voltar.
function _pararSnake() { if (_snakeAtivo) { _snakeAtivo.parar(); _snakeAtivo = null; } }
// Se a aba/app perde o foco durante a partida, encerra o jogo e deixa o botão pronto pra recomeçar
// (em vez de rodar escondido/congelar). Registrado uma vez — o script roda no load.
function _onVisChangeSnake() {
  if (document.hidden && _snakeAtivo) {
    _pararSnake();
    const b = document.getElementById('snakeStartBtn');
    if (b) { b.textContent = '▶ Recomeçar'; b.style.display = ''; }
  }
}
document.addEventListener('visibilitychange', _onVisChangeSnake);

function openJogo() {
  _pararSnake();                 // mata qualquer loop/listener de sessão anterior → reabre SEMPRE limpo
  document.getElementById('gameOverlay').classList.add('show');
  lockBodyScroll();
  renderJogo();                  // DOM fresco: canvas novo + botão ▶ Começar funcional
  carregarRankingCobrinha();
}
function closeJogo() {
  _pararSnake();
  document.getElementById('gameOverlay').classList.remove('show');
  unlockBodyScroll();
}
function renderJogo() {
  document.getElementById('gameContent').innerHTML = `
    <div class="sheet-title">🐍 Cobrinha do Joey</div>
    <div id="gameWrap">
      <div class="game-score">Pontos: <span id="snakeScore">0</span></div>
      <div id="snakeStage">
        <canvas id="snakeCanvas" width="300" height="300"></canvas>
        <div id="snakeOver"></div>
      </div>
      <div class="game-hint">No teclado: setas ou WASD. No celular: deslize o dedo na tela.<br>Pegue a comida e cresça — não bata na parede nem em você mesmo.</div>
      <button class="btn-main" id="snakeStartBtn" onclick="iniciarPartida()">▶ Começar</button>
      <div style="width:100%;margin-top:.75rem">
        <div class="sheet-title" style="font-size:1.05rem;margin:.25rem 0 .75rem">🏆 Ranking de ${_mesNome()}</div>
        <div class="rank-list" id="rankList"><div class="game-hint">Carregando…</div></div>
        <div class="game-hint" style="margin-top:.6rem">${_escG(CONFIG.premioJogo || 'O 1º lugar do mês ganha um lanche! 🍔')}</div>
        <div class="game-hint" style="margin-top:.25rem;color:var(--text3)">O ranking zera sozinho todo dia 1º.</div>
      </div>
    </div>`;
}
function _novaComida(snake, N) {
  const livres = [];
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if (!snake.some(s => s.x === x && s.y === y)) livres.push({ x, y });
  return livres.length ? livres[Math.floor(Math.random() * livres.length)] : null; // null = tabuleiro cheio
}

// ===== Camada VISUAL do jogo (tudo em Canvas/paths — sem emoji como sprite). A mecânica/grid não dependem disto. =====
function _roundRectPath(ctx, x, y, w, h, rad) {
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function desenharFundo(ctx, LOG, N, CELL) {
  ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, LOG, LOG);
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 1; i < N; i++) { const p = i * CELL; ctx.moveTo(p, 0); ctx.lineTo(p, LOG); ctx.moveTo(0, p); ctx.lineTo(LOG, p); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,107,53,.45)'; ctx.lineWidth = 2; ctx.strokeRect(1.5, 1.5, LOG - 3, LOG - 3); // toque laranja na borda
}
// CABEÇA — ISOLADA e fácil de trocar depois. Neutra: segmento arredondado + 2 olhos virados pra direção.
function desenharCabeca(ctx, cx, cy, r, dir) {
  ctx.fillStyle = '#ff6b35';
  _roundRectPath(ctx, cx - r, cy - r, r * 2, r * 2, r * 0.55); ctx.fill();
  const off = r * 0.4, sep = r * 0.42, eyeR = r * 0.23;
  const fx = cx + dir.x * off, fy = cy + dir.y * off;        // base dos olhos à frente, na direção
  const px = -dir.y, py = dir.x;                             // eixo perpendicular ao movimento
  for (const s of [-1, 1]) {
    const ox = fx + px * sep * s, oy = fy + py * sep * s;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ox, oy, eyeR, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(ox + dir.x * eyeR * 0.45, oy + dir.y * eyeR * 0.45, eyeR * 0.55, 0, 7); ctx.fill();
  }
}
function desenharSegmento(ctx, cx, cy, r, claro) {
  ctx.fillStyle = claro ? '#e3a85a' : '#d99a4e';            // cor de pão, 2 tons sutis (corpo uniforme)
  _roundRectPath(ctx, cx - r, cy - r, r * 2, r * 2, r * 0.5); ctx.fill();
}
// COMIDA: alterna 'burger'/'pizza' a cada item; formas simples reconhecíveis; 'pulse' = escala oscilante.
function desenharComida(ctx, cx, cy, r, tipo, pulse) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(pulse, pulse);
  if (tipo === 'pizza') {
    ctx.fillStyle = '#d9803a'; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.85, r * 0.72); ctx.lineTo(-r * 0.85, r * 0.72); ctx.closePath(); ctx.fill(); // fatia (crosta)
    ctx.fillStyle = '#f2c44e'; ctx.beginPath(); ctx.moveTo(0, -r * 0.7); ctx.lineTo(r * 0.6, r * 0.48); ctx.lineTo(-r * 0.6, r * 0.48); ctx.closePath(); ctx.fill(); // queijo
    ctx.fillStyle = '#c0392b'; for (const d of [[-r * 0.2, r * 0.06], [r * 0.18, r * 0.22], [0, -r * 0.28]]) { ctx.beginPath(); ctx.arc(d[0], d[1], r * 0.11, 0, 7); ctx.fill(); } // pepperoni
  } else {
    ctx.fillStyle = '#d99a4e'; _roundRectPath(ctx, -r * 0.8, r * 0.34, r * 1.6, r * 0.42, r * 0.16); ctx.fill();   // pão de baixo
    ctx.fillStyle = '#3aa757'; ctx.fillRect(-r * 0.84, r * 0.26, r * 1.68, r * 0.13);                              // alface
    ctx.fillStyle = '#7a4a22'; _roundRectPath(ctx, -r * 0.78, 0, r * 1.56, r * 0.32, r * 0.14); ctx.fill();        // carne
    ctx.fillStyle = '#e3a85a'; ctx.beginPath(); ctx.arc(0, r * 0.02, r * 0.82, Math.PI, 0, true); ctx.closePath(); ctx.fill(); // pão de cima (cúpula)
    ctx.fillStyle = 'rgba(255,255,255,.55)'; for (const dx of [-r * 0.32, 0, r * 0.32]) { ctx.beginPath(); ctx.ellipse(dx, -r * 0.34, r * 0.07, r * 0.045, 0, 0, 7); ctx.fill(); } // gergelim
  }
  ctx.restore();
}
function mostrarFimDeJogo(score) {
  const el = document.getElementById('snakeOver');
  if (!el) return;
  el.innerHTML = `
    <div class="go-title">Fim de jogo!</div>
    <div class="go-score">Você fez <strong>${score}</strong> ponto${score === 1 ? '' : 's'}</div>
    <div class="go-rank" id="snakeRankFim">🏆 calculando posição…</div>
    <button class="btn-main" style="margin-top:.4rem" onclick="iniciarPartida()">▶ Jogar de novo</button>`;
  el.classList.add('show');
}
function _setRankFim(pos) {
  const el = document.getElementById('snakeRankFim');
  if (!el) return;
  el.textContent = pos ? `🏆 #${pos} no ranking de ${_mesNome()}` : '🏆 jogue mais pra entrar no ranking!';
}
async function _posicaoNoRanking() {
  const tel = _telDigits(); if (!tel) return null;
  try {
    const snap = await db.collection(`clientes/${slug}/${RANKING_COL}`).where('mesAno', '==', _mesAnoAtual()).get();
    const todos = snap.docs.map(d => d.data()).sort((a, b) => (b.score || 0) - (a.score || 0));
    const idx = todos.findIndex(x => x.telefone === tel);
    return idx >= 0 ? idx + 1 : null;
  } catch (e) { return null; }
}
function iniciarPartida() {
  _pararSnake();                 // mata qualquer loop/listener anterior antes de começar
  const canvas = document.getElementById('snakeCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const N = 15, LOG = 300, CELL = LOG / N;
  const dpr = Math.min(2, window.devicePixelRatio || 1);    // nitidez (cap 2 p/ não pesar no mobile)
  canvas.width = LOG * dpr; canvas.height = LOG * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);                    // desenho sempre em coords lógicas 0..300
  // ESTADO DE GRID — mecânica INTOCADA (posições por célula). prevSnake = só p/ interpolar o desenho.
  let snake = [{ x: 7, y: 7 }], prevSnake = [{ x: 7, y: 7 }];
  let dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 };
  let food = _novaComida(snake, N), foodTipo = 'burger';
  let score = 0, tickMs = 160;
  let lastStep = 0, raf = 0, rodando = true;
  const particles = [];
  const scoreEl = document.getElementById('snakeScore');
  const startBtn = document.getElementById('snakeStartBtn');
  const overEl = document.getElementById('snakeOver');
  if (scoreEl) scoreEl.textContent = '0';
  if (startBtn) startBtn.style.display = 'none';
  if (overEl) overEl.classList.remove('show');
  // ---- controles INTOCADOS: teclado + swipe, sem 180° ----
  const setDir = (nx, ny) => { if (nx === -dir.x && ny === -dir.y) return; nextDir = { x: nx, y: ny }; };
  const onKey = (e) => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir(0, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir(0, 1);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(-1, 0);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir(1, 0);
    else return;
    e.preventDefault();
  };
  let tsx = 0, tsy = 0;
  const onTS = (e) => { const t = e.touches[0]; tsx = t.clientX; tsy = t.clientY; };
  const onTM = (e) => { e.preventDefault(); }; // bloqueia scroll durante o swipe
  const onTE = (e) => {
    const t = e.changedTouches[0], dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
  };
  document.addEventListener('keydown', onKey);
  canvas.addEventListener('touchstart', onTS, { passive: true });
  canvas.addEventListener('touchmove', onTM, { passive: false });
  canvas.addEventListener('touchend', onTE, { passive: true });
  const parar = () => {                                      // teardown: cancela o rAF + remove listeners (não vaza loop)
    rodando = false; cancelAnimationFrame(raf);
    document.removeEventListener('keydown', onKey);
    canvas.removeEventListener('touchstart', onTS);
    canvas.removeEventListener('touchmove', onTM);
    canvas.removeEventListener('touchend', onTE);
  };
  const burst = (cx, cy) => {                                // partículas ao comer (limitadas p/ performance)
    for (let i = 0; i < 8; i++) { const a = Math.PI * 2 * i / 8; particles.push({ x: cx, y: cy, vx: Math.cos(a) * 1.7, vy: Math.sin(a) * 1.7, life: 1 }); }
    if (particles.length > 36) particles.splice(0, particles.length - 36);
  };
  const gameOver = () => {                                   // fim de jogo: mesma condição (mecânica) + polish
    parar(); _snakeAtivo = null;
    const stage = document.getElementById('snakeStage');
    if (stage) { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); } // shake da arena
    if (startBtn) startBtn.style.display = 'none';           // recomeçar vive no painel #snakeOver
    mostrarFimDeJogo(score);
    salvarScoreCobrinha(score);                              // RANKING/SCORE INTOCADOS
    (async () => { const pos = await _posicaoNoRanking(); _setRankFim(pos); })();
  };
  const step = () => {                                       // = lógica antiga do tick (grid), INTOCADA
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    prevSnake = snake.map(s => ({ x: s.x, y: s.y }));        // snapshot p/ interpolação suave
    snake.unshift(head);
    if (food && head.x === food.x && head.y === food.y) {
      score++;
      if (scoreEl) { scoreEl.textContent = score; scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
      burst(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
      foodTipo = foodTipo === 'burger' ? 'pizza' : 'burger'; // alterna a cada item
      food = _novaComida(snake, N);
      if (!food) return gameOver();                          // tabuleiro cheio (venceu)
      tickMs = Math.max(70, 160 - score * 4);                // acelera conforme cresce (igual)
    } else { snake.pop(); }
  };
  const render = (now) => {
    const t = Math.min(1, (now - lastStep) / tickMs);        // 0..1 entre passos → cobra desliza
    desenharFundo(ctx, LOG, N, CELL);
    if (food) { const pulse = 1 + Math.sin(now / 170) * 0.09; desenharComida(ctx, food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.42, foodTipo, pulse); }
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = '#ffb077'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    const r = CELL * 0.46;
    for (let i = snake.length - 1; i >= 0; i--) {            // rabo → cabeça
      const cur = snake[i], prev = prevSnake[i] || cur;      // segmento sem prev (cresceu) = estático
      const cx = (prev.x + (cur.x - prev.x) * t) * CELL + CELL / 2;
      const cy = (prev.y + (cur.y - prev.y) * t) * CELL + CELL / 2;
      if (i === 0) desenharCabeca(ctx, cx, cy, r, dir);
      else desenharSegmento(ctx, cx, cy, r, i % 2 === 0);
    }
  };
  const frame = (now) => {
    if (!rodando) return;
    raf = requestAnimationFrame(frame);
    if (!lastStep) lastStep = now;
    if (now - lastStep >= tickMs) { lastStep = now; step(); if (!rodando) return; } // 1 passo de grid por vez
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.9; p.vy *= 0.9; p.life -= 0.05; }
    for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
    render(now);
  };
  _snakeAtivo = { parar };
  raf = requestAnimationFrame(frame);
}
async function salvarScoreCobrinha(score) {
  // SALVAGUARDA: teto de score (anti-trapaça) + ignora zero/inválido + exige identidade do checkout
  if (!Number.isInteger(score) || score <= 0 || score > SCORE_MAX) return;
  const tel = _telDigits();
  if (!tel || !clienteData?.nome) return; // sem nome/telefone do checkout → não grava (não polui o ranking)
  const mesAno = _mesAnoAtual();
  try {
    await _garantirAuthValida();
    const ref = db.collection(`clientes/${slug}/${RANKING_COL}`).doc(`${mesAno}__${tel}`); // 1 doc por jogador/mês = guarda só o MELHOR
    const snap = await ref.get();
    if (snap.exists && (snap.data().score || 0) >= score) return; // só grava se superou o próprio recorde do mês
    await ref.set({ nome: String(clienteData.nome).slice(0, 60), telefone: tel.slice(0, 20), score, mesAno, criadoEm: firebase.firestore.FieldValue.serverTimestamp() });
    carregarRankingCobrinha();
  } catch (e) { console.warn('[cobrinha] não salvou score:', (e && e.message) || e); }
}
async function carregarRankingCobrinha() {
  const el = document.getElementById('rankList');
  if (!el) return;
  try {
    const mesAno = _mesAnoAtual(), meuTel = _telDigits();
    const snap = await db.collection(`clientes/${slug}/${RANKING_COL}`).where('mesAno', '==', mesAno).get();
    const todos = snap.docs.map(d => d.data()).sort((a, b) => (b.score || 0) - (a.score || 0)); // ordena no cliente (sem índice composto)
    if (!todos.length) { el.innerHTML = '<div class="game-hint">Ninguém pontuou esse mês ainda. Seja o primeiro! 🐍</div>'; return; }
    const medalha = (p) => p === 1 ? '🥇' : p === 2 ? '🥈' : p === 3 ? '🥉' : p + 'º';
    const linha = (x, p, eu) => `<div class="rank-row${eu ? ' me' : ''}"><span class="rank-pos">${medalha(p)}</span><span class="rank-nome">${_escG(x.nome || '—')} <span style="color:var(--text3);font-size:.72rem">${_telMasc(x.telefone)}</span>${eu ? ' • você' : ''}</span><span class="rank-score">${x.score || 0}</span></div>`;
    let html = todos.slice(0, 10).map((x, i) => linha(x, i + 1, !!meuTel && x.telefone === meuTel)).join('');
    const meuIdx = meuTel ? todos.findIndex(x => x.telefone === meuTel) : -1;
    if (meuIdx >= 10) html += `<div style="text-align:center;color:var(--text3);font-size:.8rem;margin:2px 0">⋯</div>` + linha(todos[meuIdx], meuIdx + 1, true); // destaca o jogador fora do top 10
    el.innerHTML = html;
  } catch (e) { console.warn('[cobrinha] ranking:', (e && e.message) || e); el.innerHTML = '<div class="game-hint">Ranking indisponível agora.</div>'; }
}

function renderInfoLoja() {
  const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const horarios = CONFIG.horarios || {};

  const diasAtivos = DIAS.map((nome, i) => {
    const h = horarios[i];
    if (!h || !h.ativo) return null;
    return { nome, abre: h.abre || '', fecha: h.fecha || '' };
  }).filter(Boolean);

  const horariosHtml = diasAtivos.length
    ? diasAtivos.map(d => `
        <div class="info-row">
          <span class="info-day">${d.nome}</span>
          <span class="info-hours">${d.abre} – ${d.fecha}</span>
        </div>`).join('')
    : `<p style="font-size:13px;color:var(--text3);padding:6px 0">Horários não configurados.</p>`;

  const endLimpo = (CONFIG.end || '').trim();
  const endHtml = endLimpo
    ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(endLimpo)}"
          target="_blank" rel="noopener"
          style="color:var(--orange);text-decoration:none;font-size:13px;display:flex;align-items:flex-start;gap:8px;line-height:1.5">
          <span style="font-size:15px;flex-shrink:0;margin-top:1px">📍</span>
          <span>${endLimpo}</span>
       </a>`
    : `<span style="font-size:13px;color:var(--text3)">Endereço não informado.</span>`;

  document.getElementById('infoContent').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem">
      <div>
        <div class="sheet-title" style="margin-bottom:4px">${CONFIG.nome}</div>
        <div style="font-size:12px;color:var(--text2)">Delivery · Retirada · No local</div>
      </div>
      <button onclick="closeInfoLoja()" style="background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1;flex-shrink:0;margin-left:12px">✕</button>
    </div>

    <div style="margin-bottom:1.5rem">
      <div class="info-section-lbl">Endereço</div>
      ${endHtml}
    </div>

    <div style="margin-bottom:1.5rem">
      <div class="info-section-lbl">Horários de atendimento</div>
      ${horariosHtml}
    </div>

    <div style="margin-bottom:1.5rem">
      <div class="info-section-lbl">Formas de pagamento</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="info-pay-chip">💚 PIX</span>
        <span class="info-pay-chip">💵 Dinheiro</span>
        <span class="info-pay-chip">💳 Débito</span>
        <span class="info-pay-chip">💳 Crédito</span>
      </div>
    </div>
  `;
}

  document.getElementById('histContent').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <div class="sheet-title" style="margin:0">📋 Meus Pedidos</div>
      <button onclick="closeHist()" style="background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;line-height:1.5">Informe o WhatsApp usado no pedido para ver seu histórico.</p>
    <div class="form-group">
      <label class="form-label">WhatsApp</label>
      <input class="form-input" id="histTelInput" placeholder="(00) 00000-0000" type="tel"

    <button class="btn-secondary" onclick="closeHist()">Fechar</button>

}

function buscarHistPorTel() {
  const tel = document.getElementById('histTelInput')?.value.trim();

function renderHistLista(lista, tel) {

      <button onclick="closeHist()" style="background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1">✕</button>

      <div style="text-align:center;padding:2rem 1rem;color:var(--text3)">

// =================== PIX SCREEN ===================
let pixScreenListener = null;
let pixExpiraTimer    = null;

function renderStepPix(el) {
  const id = ultimoPedido?.id;
  el.innerHTML = `
    <div style="text-align:center;padding:1rem 0">
      <div style="font-size:2rem;margin-bottom:.5rem">💚</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:.25rem">Pedido #${id} recebido!</div>
      <div id="pixAreaConteudo" style="margin-top:1rem">
        <div style="font-size:14px;color:var(--text2)">⏳ Gerando seu PIX, aguarde...</div>
      </div>
    </div>`;

  if (pixScreenListener) pixScreenListener();
  pixScreenListener = db.collection(`clientes/${slug}/pedidos`).doc(id).onSnapshot(snap => {
    const d = snap.data();
    if (!d) return;
    const area = document.getElementById('pixAreaConteudo');
    if (!area) return;

    if (d.pixStatus === 'aguardando_geracao' || d.pixStatus === 'gerando') {
      area.innerHTML = '<div style="font-size:14px;color:var(--text2)">⏳ Gerando seu pagamento, aguarde...</div>';
    } else if (d.pixStatus === 'pendente' && d.pixQrCodeBase64) {
      mostrarQrCodeCardapio(area, d);
    } else if (d.pixStatus === 'pago') {
      mostrarPixPagoCardapio(area, d);
      if (pixScreenListener) { pixScreenListener(); pixScreenListener = null; }
      if (pixExpiraTimer)    { clearInterval(pixExpiraTimer); pixExpiraTimer = null; }
    } else if (d.pixStatus === 'expirado' || d.status === 'cancelado') {
      if (pixExpiraTimer) { clearInterval(pixExpiraTimer); pixExpiraTimer = null; }
      area.innerHTML = `
        <div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:.5rem">⏰ Pagamento expirado</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:1rem">O pagamento não foi realizado a tempo.</div>
        <button class="btn-secondary" onclick="closeCart()">Fechar</button>`;
    } else if (typeof d.pixStatus === 'string' && d.pixStatus.indexOf('erro') === 0) {
      // erro_geracao, erro_config, erro_mp...
      if (pixExpiraTimer) { clearInterval(pixExpiraTimer); pixExpiraTimer = null; }
      area.innerHTML = `
        <div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:.5rem">❌ Não foi possível gerar o pagamento</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:1rem">Entre em contato com o restaurante para concluir seu pedido.</div>
        <button class="btn-secondary" onclick="closeCart()">Fechar</button>`;
    }
  });
}

function mostrarQrCodeCardapio(area, d) {
  // Extrai como primitivo para evitar mutação da closure
  const expiraMs = Number(d.pixExpira);
  console.log('[PIX-CARDAPIO] pixExpira:', expiraMs, '| now:', Date.now(), '| diff_ms:', expiraMs - Date.now(), '| diff_seg:', Math.round((expiraMs - Date.now()) / 1000));

  area.innerHTML = `
    <div style="font-size:13px;color:var(--text2);margin-bottom:.75rem">Escaneie o QR Code ou use o Pix Copia e Cola</div>
    <img src="data:image/png;base64,${d.pixQrCodeBase64}" style="width:190px;height:190px;border:2px solid var(--border);border-radius:10px;margin-bottom:.75rem;display:block;margin-left:auto;margin-right:auto">
    <div style="font-size:12px;color:var(--text2);margin-bottom:.25rem">Pix Copia e Cola:</div>
    <div onclick="copiarPixCardapio(this,'${encodeURIComponent(d.pixCopiaECola||'')}')"
         style="cursor:pointer;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;word-break:break-all;color:var(--text);margin-bottom:.75rem;text-align:left">
      ${(d.pixCopiaECola||'').substring(0,60)}...<br>
      <span style="font-weight:700;color:var(--orange)">📋 Toque para copiar</span>
    </div>
    <div id="pixTimerCardapio" style="font-size:14px;font-weight:700;color:#b45309;margin-bottom:.5rem"></div>
    <div style="font-size:12px;color:var(--text2)">Aguarde a confirmação do pagamento...</div>`;

  if (pixExpiraTimer) clearInterval(pixExpiraTimer);
  pixExpiraTimer = setInterval(() => {
    const el = document.getElementById('pixTimerCardapio');
    if (!el) { clearInterval(pixExpiraTimer); return; }
    const rest = expiraMs - Date.now(); // usa primitivo capturado, não d.pixExpira
    if (rest <= 0) {
      el.textContent = '⚠️ PIX expirado';
      el.style.color = '#dc2626';
      clearInterval(pixExpiraTimer);
      return;
    }
    const min  = Math.floor(rest / 60000);
    const seg  = Math.floor((rest % 60000) / 1000);
    el.textContent = '⏳ Expira em ' + String(min).padStart(2,'0') + ':' + String(seg).padStart(2,'0');
    el.style.color = rest < 120000 ? '#dc2626' : '#b45309';
  }, 1000);
}

function mostrarPixPagoCardapio(area, d) {
  area.innerHTML = `
    <div style="font-size:3rem;margin-bottom:.5rem">🎉</div>
    <div style="font-size:18px;font-weight:700;color:#16a34a;margin-bottom:.5rem">Pagamento confirmado!</div>
    <div style="font-size:14px;color:var(--text2);margin-bottom:1rem">Seu pedido entrou na fila de produção.</div>
    <button class="btn-main" onclick="closeCart();openMeusPedidos()" style="margin-bottom:.5rem">📋 Acompanhar pedido</button>
    <button class="btn-secondary" onclick="closeCart()">Fazer novo pedido</button>`;
}

function copiarPixCardapio(el, encoded) {
  const texto = decodeURIComponent(encoded);
  navigator.clipboard?.writeText(texto).then(() => {
    el.querySelector('span').textContent = '✅ Copiado!';
    setTimeout(() => { if(el.querySelector('span')) el.querySelector('span').textContent = '📋 Toque para copiar'; }, 2500);
  }).catch(() => alert('Copie manualmente: ' + texto.substring(0,30) + '...'));
}

// =================== PEÇA DE NOVO ===================
let _pecaDeNovoIds = []; // [{id, count}] ordenado por frequência

function carregarPecaDeNovo() {
  if (!clienteData?.tel) return;
  db.collection(`clientes/${slug}/pedidos`)
    .where('tel', '==', clienteData.tel)
    .orderBy('criadoEm', 'desc')
    .limit(30)
    .get()
    .then(snap => {
      const freq = {};
      snap.docs.forEach(doc => {
        (doc.data().itens || []).forEach(item => {
          if (!item.id) return;
          freq[String(item.id)] = (freq[String(item.id)] || 0) + (item.qty || 1);
        });
      });
      _pecaDeNovoIds = Object.entries(freq)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([id]) => id);
      renderPecaDeNovo();
    })
    .catch(() => {});
}

function renderPecaDeNovo() {
  const sec = document.getElementById('pecaDeNovo');
  if (!sec) return;
  const items = _pecaDeNovoIds
    .map(id => CARDAPIO.find(p => String(p.id) === id))
    .filter(Boolean);
  if (!items.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  sec.innerHTML = `
    <div class="reorder-title">🔄 Peça de novo</div>
    <div class="reorder-list">
      ${items.map(p => `
        <div class="reorder-card" onclick="quickAdd('${p.id}')">
          <button class="reorder-add">+</button>
          <div class="reorder-img">${p.foto ? `<img src="${p.foto}" alt="${p.nome}">` : p.emoji}</div>
          <div class="reorder-name">${p.nome}</div>
          <div class="reorder-price">R$ ${p.preco.toFixed(2).replace('.',',')}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// =================== MUSIC PLAYER (YouTube) ===================
var _ytPlayer     = null;
var _ytReady      = false;
var _ytPending    = false;
var _ytUserPaused = sessionStorage.getItem('musicPaused') === '1';
var _ytApiReady    = false;
var _ytConfigReady = false;
var _ytInitDone    = false;
var _ytShuffleAplicado = false; // setShuffle já aplicado à playlist carregada (uma vez)

function _ytUpdateBtn(playing) {
  var btn = document.getElementById('musicBtn');
  if (!btn) return;
  btn.textContent = playing ? '🎵' : '🔇';
  btn.classList.toggle('playing', !!playing);
}

// Início numa faixa aleatória SEM assumir nº fixo de faixas (usa o tamanho real da playlist)
function _ytStartRandom() {
  if (!_ytPlayer) return;
  var pl = _ytPlayer.getPlaylist && _ytPlayer.getPlaylist();
  if (pl && pl.length) _ytPlayer.playVideoAt(Math.floor(Math.random() * pl.length));
  else _ytPlayer.playVideo();
}

// Shuffle por tenant (config/loja.playlistShuffle, gravado pelo admin): aplica setShuffle assim que a
// playlist carrega e inicia a reprodução SE permitido (mesma trava de autoplay/mute: só com _ytPending).
// shuffle on → setShuffle(true) + faixa aleatória; off/ausente → setShuffle(false) + ordem da playlist.
function _ytPrepararEIniciar(tentativa) {
  if (!_ytPlayer || !_ytReady) return;
  var shuffleOn = !!(typeof CONFIG !== 'undefined' && CONFIG.playlistShuffle === true);
  if (!_ytShuffleAplicado) {
    var pl = _ytPlayer.getPlaylist && _ytPlayer.getPlaylist();
    if (shuffleOn && (!pl || !pl.length) && (tentativa || 0) < 30) {
      setTimeout(function(){ _ytPrepararEIniciar((tentativa || 0) + 1); }, 100); // espera a playlist p/ o setShuffle pegar
      return;
    }
    _ytPlayer.setShuffle(shuffleOn);
    _ytPlayer.setLoop(true);
    _ytShuffleAplicado = true;
  }
  if (_ytPending && !_ytUserPaused) {
    _ytPending = false;
    if (shuffleOn) _ytStartRandom();   // embaralhado: começa numa faixa aleatória
    else _ytPlayer.playVideo();        // ordem normal: começa do início da playlist
  }
}

// Música SOMENTE com o aditivo "Player de música" ligado para ESTE tenant: ao ligar, o admin grava a
// playlist do próprio cliente em config/loja.playlistMusica ('PL…'); ao desligar (ou nunca ligar), fica
// ''/undefined. '' / undefined → SEM música. Nunca cai em playlist fixa/de outro tenant (sem default cross-tenant).
function _resolveMusicList() {
  var pm = (typeof CONFIG !== 'undefined') ? CONFIG.playlistMusica : undefined;
  return (typeof pm === 'string' && pm.trim() !== '') ? pm.trim() : '';
}

// Cria o player só quando a API do YouTube E a config já chegaram (uma única vez).
function _maybeInitMusic() {
  if (_ytInitDone || !_ytApiReady || !_ytConfigReady) return;
  _ytInitDone = true;
  var listId = _resolveMusicList();
  if (!listId) {                                   // sem música → esconde a barra, não cria player
    var bar = document.getElementById('musicBar');
    if (bar) bar.style.display = 'none';
    return;
  }
  _ytPlayer = new YT.Player('ytPlayerEl', {
    playerVars: {
      listType:'playlist', list:listId, autoplay:0, controls:0, disablekb:1, fs:0,
      iv_load_policy:3, modestbranding:1, rel:0, playsinline:1, origin:location.origin
    },
    events: {
      onReady: function() {
        _ytReady = true;
        _ytPrepararEIniciar(0);   // setShuffle conforme o tenant (espera a playlist se preciso) + inicia se permitido
      },
      onStateChange: function(e) {
        var playing = e.data === YT.PlayerState.PLAYING;
        _ytUpdateBtn(playing);
        if (playing) { sessionStorage.removeItem('musicPaused'); _ytUserPaused = false; }
        else if (e.data === YT.PlayerState.PAUSED) { sessionStorage.setItem('musicPaused', '1'); _ytUserPaused = true; }
      }
    }
  });
}

window.onYouTubeIframeAPIReady = function() { _ytApiReady = true; _maybeInitMusic(); };

function _ytToggle() {
  if (!_ytPlayer || !_ytReady) return;
  if (_ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
    _ytPlayer.pauseVideo();
  } else {
    _ytPlayer.playVideo();
  }
}
function _ytPrev() { if (_ytPlayer && _ytReady) _ytPlayer.previousVideo(); }
function _ytNext() { if (_ytPlayer && _ytReady) _ytPlayer.nextVideo(); }

(function() {
  function _onFirstInteraction() {
    document.removeEventListener('click',      _onFirstInteraction, true);
    document.removeEventListener('touchstart', _onFirstInteraction, true);
    if (_ytUserPaused) return;
    _ytPending = true;
    if (_ytReady) _ytPrepararEIniciar(0);
  }
  document.addEventListener('click',      _onFirstInteraction, true);
  document.addEventListener('touchstart', _onFirstInteraction, true);
})();
</script>
