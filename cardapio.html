<html lang="pt-BR">

<meta property="og:description" content="Faça seu pedido online 🍔">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.cdnfonts.com/css/abstante');
*{box-sizing:border-box;margin:0;padding:0}
input,textarea,select{font-size:16px}
:root{
  --bg:#0f0f0f;
  --bg2:#1a1a1a;
  --bg3:#222;
  --card:#1e1e1e;
  --border:#2e2e2e;
  --orange:#ff6b35;
  --orange2:#ff8c5a;
  --cream:#f5f0e8;
  --text:#f0ede8;
  --text2:#999;
  --text3:#555;
  --success:#2ecc71;
  --radius:16px;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:68px;
}

/* HERO */
.hero{
  position:relative;
  isolation:isolate;
  background:url('/joey_header.jpg') center 45% / 120% auto no-repeat;
  padding:3.5rem 1.5rem 2rem;
  text-align:center;
  border-bottom:1px solid var(--border);
  overflow:hidden;
}
.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(6,3,1,.58) 0%,rgba(4,2,0,.82) 100%);
  pointer-events:none;
  z-index:0;
}
.hero-logo{
  position:relative;z-index:1;
  font-family:'Abstante',sans-serif;
  font-size:clamp(3.5rem,12vw,6.5rem);
  font-weight:900;
  color:#fff;
  letter-spacing:-1px;
  line-height:1;
  margin-bottom:1.5rem;
  text-shadow:0 2px 20px rgba(0,0,0,.9),0 0 40px rgba(255,107,53,.35);
  animation: neonWhite 2.5s ease-in-out infinite alternate;
}
.hero-sub{display:none}
.hero-info{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  gap:8px;flex-wrap:wrap;
  font-size:12px;color:rgba(255,255,255,.75);
  margin-bottom:1rem;
}
.hero-info-sep{color:rgba(255,255,255,.35);margin:0 2px}
.hero-badge{
  position:relative;z-index:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,107,53,0.15);
  border:1px solid rgba(255,107,53,0.4);
  border-radius:999px;
  padding:6px 14px;
  font-size:12px;
  color:#ff9d6f;
}
.dot-pulse{
  width:8px;height:8px;border-radius:50%;
  background:var(--success);
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}

/* CARRINHO FLUTUANTE — substituído pelo bottom nav */
.cart-btn{display:none!important}
.cart-count{display:none}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:60px;
  background:#1a1d24;
  border-top:1px solid rgba(255,255,255,0.07);
  display:flex;align-items:stretch;
  z-index:200;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,0.35);
  font-family:'DM Sans',sans-serif;
  transition:color .15s;
  position:relative;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.bnav-btn:active{color:#ff6b35}
.bnav-btn.active{color:#ff6b35}
.bnav-icon{font-size:22px;line-height:1}
.bnav-label{font-size:10px;font-weight:500;letter-spacing:.3px}
.bnav-badge{
  position:absolute;top:7px;left:calc(50% + 5px);
  background:#ff6b35;color:#fff;
  border-radius:999px;padding:1px 5px;
  font-size:9px;font-weight:700;line-height:1.5;
  min-width:16px;text-align:center;
  display:none;
  border:2px solid #1a1d24;
}
.bnav-badge.show{display:block}

/* PEÇA DE NOVO */
#pecaDeNovo{display:none;padding:1.1rem 0 0;border-bottom:1px solid var(--border)}
.reorder-title{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;padding:0 1.5rem;margin-bottom:10px}
.reorder-list{display:flex;gap:10px;overflow-x:auto;padding:0 1.5rem 12px;scrollbar-width:none}
.reorder-list::-webkit-scrollbar{display:none}
.reorder-card{
  flex-shrink:0;width:100px;
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:10px 8px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  position:relative;transition:border-color .2s;
}
.reorder-card:active{border-color:var(--orange)}
.reorder-img{
  width:46px;height:46px;border-radius:8px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg3);font-size:22px;flex-shrink:0;
}
.reorder-img img{width:100%;height:100%;object-fit:cover}
.reorder-name{
  font-size:11px;font-weight:500;color:var(--text);
  text-align:center;line-height:1.3;width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.reorder-price{font-size:11px;color:var(--orange);font-weight:600}
.reorder-add{
  position:absolute;top:5px;right:5px;
  width:20px;height:20px;border-radius:50%;
  background:var(--orange);border:none;color:#fff;
  font-size:15px;line-height:1;cursor:pointer;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}

/* CATEGORIAS */
.cat-nav{
  display:flex;gap:8px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  padding:1.25rem 1.5rem;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
  position:-webkit-sticky;position:sticky;top:0;z-index:50;
}
.cat-nav::-webkit-scrollbar{display:none}
.cat-pill{
  flex-shrink:0;
  padding:8px 18px;
  border-radius:999px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text2);
  font-size:13px;font-weight:500;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  transition:all 0.2s;
  white-space:nowrap;
}
.cat-pill:hover{border-color:var(--orange);color:var(--text)}
.cat-pill.active{background:var(--orange);border-color:var(--orange);color:#fff}

/* SEÇÃO */
.section{padding:2rem 1.5rem}
.section-title{
  font-family:'Playfair Display',serif;
  font-size:1.6rem;font-weight:700;
  color:var(--cream);
  margin-bottom:1.25rem;
  display:flex;align-items:center;gap:10px;
}
.section-title span{font-size:1.4rem}

/* GRID DE PRODUTOS — 2 colunas */
.products-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* CARD DE PRODUTO */
.product-row{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;
}
.product-row-img{
  width:100%;height:110px;
  border-radius:0;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;flex-shrink:0;overflow:hidden;
}
.product-row-img img{width:100%;height:100%;object-fit:cover;border-radius:0}
.product-row-info{flex:1;min-width:0;padding:8px 10px 10px}
.product-row-name{
  font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;
}
.product-row-desc{
  font-size:11px;color:var(--text2);line-height:1.35;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.product-row-price{font-size:13px;font-weight:700;color:var(--orange)}

/* CARD DE DESTAQUE */
.destaque-card{
  background:var(--card);
  border:1px solid rgba(255,107,53,0.25);
  border-radius:16px;overflow:hidden;
  cursor:pointer;transition:border-color .2s;
}
.destaque-card:active{border-color:var(--orange)}
.destaque-img{
  width:100%;height:110px;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;overflow:hidden;position:relative;
}
.destaque-img img{width:100%;height:100%;object-fit:cover;display:block}
.destaque-tag{
  position:absolute;top:8px;left:8px;
  background:var(--orange);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
}
.destaque-body{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.destaque-info{flex:1;min-width:0}
.destaque-nome{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.destaque-desc{font-size:11px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.destaque-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.destaque-preco{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--orange)}
.destaque-btn{
  width:30px;height:30px;border-radius:50%;
  background:var(--orange);border:none;color:#fff;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* EMPTY STATE */
.empty-cat{
  text-align:center;padding:3rem;
  color:var(--text3);
}

/* === OVERLAY / MODAL === */
.overlay{
  display:none;position:fixed;
  top:0;left:0;right:0;bottom:0;
  inset:0;background:rgba(0,0,0,0.85);
  z-index:200;
  align-items:flex-end;
  justify-content:center;
}
.overlay.show{display:flex;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.sheet{
  background:var(--bg2);
  border-radius:24px 24px 0 0;
  width:100%;max-width:600px;
  max-height:90vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:1.5rem;
  animation:slideUp 0.3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* produto modal — centrado, não bottom-sheet */
#productOverlay{align-items:center;padding:0 1rem}
#productSheet{
  border-radius:20px;
  max-height:85vh;
  max-width:480px;
  display:flex;flex-direction:column;
  overflow:hidden;
  padding:0;
  animation:scaleIn .2s ease;
}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
#productContent{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.25rem 1.5rem .5rem}
#productFooter{
  /* respiro embaixo do botão "Confirmar pedido" p/ não encostar na bottom-nav (60px) + safe-area do iPhone */
  padding:.75rem 1.5rem calc(76px + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--border);
  background:var(--bg2);
  flex-shrink:0;
}

/* carrinho, histórico e perfil da loja centralizados */
#cartOverlay,#histOverlay,#infoOverlay,#gameOverlay{align-items:center;padding:0 1rem}
#cartSheet,#histSheet,#infoSheet,#gameSheet{border-radius:20px;max-height:85vh;max-width:480px}

.sheet-handle{
  width:40px;height:4px;border-radius:2px;
  background:var(--border);
  margin:0 auto 1.5rem;
}
.sheet-title{
  font-family:'Playfair Display',serif;
  font-size:1.4rem;font-weight:700;
  color:var(--cream);margin-bottom:1.25rem;
}

/* JOGO DA COBRINHA (tela de acompanhamento) */
#gameWrap{display:flex;flex-direction:column;align-items:center;gap:.6rem}
#snakeStage{position:relative;width:300px;max-width:88vw;aspect-ratio:1/1}
#snakeCanvas{background:#121212;border:2px solid var(--orange);border-radius:12px;touch-action:none;width:100%;height:100%;display:block;box-shadow:0 0 18px rgba(255,107,53,.18)}
#snakeOver{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;text-align:center;padding:1rem;border-radius:12px;background:rgba(15,15,15,.9)}
#snakeOver.show{display:flex;animation:fadeIn .25s ease}
#snakeOver .go-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--orange)}
#snakeOver .go-score{color:var(--text);font-size:1rem}
#snakeOver .go-rank{color:var(--cream);font-size:.95rem;font-weight:700}
.shake{animation:snakeShake .26s ease}
@keyframes snakeShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
#snakeScore.bump{display:inline-block;animation:scoreBump .25s ease}
@keyframes scoreBump{0%{transform:scale(1)}40%{transform:scale(1.4);color:var(--orange2)}100%{transform:scale(1)}}
.game-score{font-weight:700;color:var(--orange);font-size:1.1rem}
.game-hint{font-size:.78rem;color:var(--text2);text-align:center;line-height:1.45}
.rank-list{width:100%;display:flex;flex-direction:column;gap:5px}
.rank-row{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;background:var(--bg3);border-radius:10px;font-size:.86rem}
.rank-row.me{background:rgba(255,107,53,.16);border:1px solid var(--orange)}
.rank-pos{min-width:1.7rem;text-align:center;font-weight:700;color:var(--text2)}
.rank-nome{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-score{font-weight:700;color:var(--orange)}

/* CARRINHO */
.cart-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.cart-item-name{flex:1;font-size:14px;font-weight:500}
.cart-item-price{font-size:14px;color:var(--orange);font-weight:600;min-width:70px;text-align:right}
.qty-ctrl{
  display:flex;align-items:center;gap:8px;
}
.qty-btn{
  width:28px;height:28px;border-radius:50%;
  background:var(--bg3);border:1px solid var(--border);
  color:var(--text);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;
  transition:all 0.15s;
}
.qty-btn:hover{background:var(--orange);border-color:var(--orange)}
.qty-num{font-size:14px;font-weight:600;min-width:20px;text-align:center}

.cart-total{
  display:flex;justify-content:space-between;
  align-items:center;
  padding:1rem 0;
  font-size:16px;font-weight:600;
}
.cart-total span:last-child{
  font-family:'Playfair Display',serif;
  font-size:1.4rem;color:var(--orange);
}

/* FORMULÁRIO */
.form-section{margin-bottom:1.5rem}
.form-label{
  font-size:11px;font-weight:600;
  color:var(--text3);
  text-transform:uppercase;letter-spacing:0.8px;
  display:block;margin-bottom:6px;
}
.form-input{
  width:100%;padding:12px 14px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);font-size:16px;
  font-family:'DM Sans',sans-serif;
  transition:border-color 0.2s;
}
.form-input:focus{outline:none;border-color:var(--orange)}
.form-input::placeholder{color:var(--text3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-group{margin-bottom:10px}

/* PAGAMENTO */
.payment-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:1rem;
}
.payment-option{
  border:1px solid var(--border);border-radius:10px;
  padding:12px;cursor:pointer;
  text-align:center;
  transition:all 0.2s;
  background:var(--bg3);
}
.payment-option:hover{border-color:var(--orange)}
.payment-option.selected{border-color:var(--orange);background:rgba(255,107,53,0.1)}
.payment-option .pay-icon{font-size:1.5rem;display:block;margin-bottom:4px}
.payment-option .pay-name{font-size:12px;font-weight:600;color:var(--text)}

/* ENTREGA */
.delivery-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin-bottom:1rem;
}
.delivery-option{
  border:1px solid var(--border);border-radius:10px;
  padding:12px;cursor:pointer;
  text-align:center;
  transition:all 0.2s;
  background:var(--bg3);
}
.delivery-option:hover{border-color:var(--orange)}
.delivery-option.selected{border-color:var(--orange);background:rgba(255,107,53,0.1)}
.delivery-option .del-icon{font-size:1.5rem;display:block;margin-bottom:4px}
.delivery-option .del-name{font-size:12px;font-weight:600;color:var(--text)}

/* TROCO */
.troco-box{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:12px;margin-top:8px;
  display:none;
}
.troco-box.visible{display:block}

/* BOTÃO PRINCIPAL */
.btn-main{
  width:100%;padding:16px;
  background:var(--orange);
  color:#fff;border:none;border-radius:12px;
  font-size:16px;font-weight:600;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  transition:all 0.2s;
  margin-top:8px;
}
.btn-main:hover{background:#e55a27}
.btn-main:disabled{background:var(--text3);cursor:not-allowed}
.btn-secondary{
  width:100%;padding:14px;
  background:transparent;
  color:var(--text2);border:1px solid var(--border);
  border-radius:12px;font-size:14px;font-weight:500;
  font-family:'DM Sans',sans-serif;cursor:pointer;
  transition:all 0.2s;margin-top:8px;
}
.btn-secondary:hover{border-color:var(--orange);color:var(--text)}

/* SUCESSO */
.success-screen{
  text-align:center;padding:2rem 1rem;
}
.success-icon{font-size:4rem;margin-bottom:1rem;display:block;animation:pop 0.4s ease}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
.success-title{
  font-family:'Playfair Display',serif;
  font-size:1.8rem;color:var(--success);margin-bottom:8px;
}
.success-sub{color:var(--text2);font-size:14px;line-height:1.6}
.order-code{
  display:inline-block;
  background:rgba(46,204,113,0.1);
  border:1px solid rgba(46,204,113,0.3);
  border-radius:10px;padding:10px 20px;
  font-family:monospace;font-size:1.3rem;
  color:var(--success);margin:1rem 0;
  letter-spacing:3px;
}

/* STEPS */
.steps{
  display:flex;align-items:center;gap:4px;
  margin-bottom:1.5rem;
}
.step{
  flex:1;height:3px;border-radius:2px;
  background:var(--border);
  transition:background 0.3s;
}
.step.done{background:var(--orange)}
.step-label{
  font-size:12px;color:var(--text3);
  margin-bottom:8px;
  text-align:center;
}

/* INFO BOX */
.info-note{
  background:rgba(255,107,53,0.08);
  border:1px solid rgba(255,107,53,0.2);
  border-radius:10px;padding:10px 14px;
  font-size:12px;color:var(--orange2);
  margin-bottom:1rem;
  display:flex;gap:8px;align-items:flex-start;
}

/* PRODUTO MODAL */
.prod-modal-img{
  width:100%;height:200px;
  object-fit:cover;border-radius:12px;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-size:4rem;margin-bottom:1rem;overflow:hidden;
}
.prod-modal-img img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.prod-modal-name{
  font-family:'Playfair Display',serif;
  font-size:1.5rem;font-weight:700;color:var(--cream);margin-bottom:6px;
}

<script>
// =================== FIREBASE ===================
const firebaseConfig = {
  apiKey: "AIzaSyA8yx0BXHDZee_RyLteJbSuQDzInj-GpFM",
  authDomain: "gestaojoey.firebaseapp.com",
  projectId: "gestaojoey",
  storageBucket: "gestaojoey.firebasestorage.app",
  messagingSenderId: "372331148907",
  appId: "1:372331148907:web:aa5eb48d309a167ad1a32e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const hostname = window.location.hostname;
const slug = (
  hostname === 'pedidos.hamburgueriajoey.com.br' ||
  hostname === 'hamburgueriajoey.com.br' ||
  hostname === 'www.hamburgueriajoey.com.br' ||
  hostname === 'pedidos-joey.web.app' ||
  hostname === 'pedidos-joey-painel.web.app' ||
  hostname === 'localhost' ||
  hostname === '127.0.0.1'
) ? 'joey' : hostname.split('.')[0];
firebase.auth().onAuthStateChanged(user => {
  if (user) {
    carregarDadosPainel();
  }
});
firebase.auth().signInAnonymously().catch(e => console.error('Auth anônimo falhou:', e));
// URL da Cloud Function que resolve o token (endereço + carrinho da IA). Declarada AQUI,
// ANTES da chamada abaixo: _resolverTokenEndereco roda na top-level e usa _CF_RESOLVE_TOKEN
// na parte SÍNCRONA (arg do fetch, antes do await), então o const TEM que já estar
// inicializado neste ponto — senão dá TDZ ("Cannot access '_CF_RESOLVE_TOKEN' before
// initialization") e a função aborta antes de pré-preencher endereço / injetar o carrinho.
const _CF_RESOLVE_TOKEN = 'https://southamerica-east1-gestaojoey.cloudfunctions.net/resolverEnderecoToken';
_resolverTokenEndereco(); // Parte 2: pré-preenchimento de endereço + carrinho da IA via token (independe do auth)

// Splash: saída sincronizada com o load da imagem (não mais setTimeout cego)
(function(){
  if(!document.documentElement.classList.contains('splash-on')) return;
  var sp = document.getElementById('splash');
  var img = document.getElementById('splash-img');
  if(!sp) return;
  var done = false;
  function sair(){
    if(done) return; done = true;
    sp.classList.add('splash-out');
    setTimeout(function(){
      sp.style.display='none';
      document.documentElement.classList.remove('splash-on');
    }, 450);
  }
  function agendarSaida(){ setTimeout(sair, 2400); }
  if(img && img.complete && img.naturalWidth){
    agendarSaida();
  } else if(img){
    img.addEventListener('load', agendarSaida);
    img.addEventListener('error', sair);
  } else {
    agendarSaida();
  }
  setTimeout(sair, 6000); // fallback de segurança
})();

// Captura mesa via ?mesa=X e persiste na sessão
(function() {
  const p = new URLSearchParams(window.location.search).get('mesa');
  if (p) sessionStorage.setItem('mesaAtiva', p);
})();

// =================== CARDÁPIO PADRÃO (fallback) ===================
const CARDAPIO_PADRAO = [
  {id:1,categoria:'Pizza',nome:'Margherita Clássica',desc:'Molho de tomate pelati, mussarela de búfala fresca e folhas de manjericão',preco:45.00,emoji:'🍕',foto:null},
  {id:2,categoria:'Pizza',nome:'Calabresa & Cebola',desc:'Calabresa fatiada, cebola roxa, azeitona preta e orégano artesanal',preco:42.00,emoji:'🍕',foto:null},
  {id:3,categoria:'Pizza',nome:'Quatro Queijos',desc:'Mussarela, provolone, parmesão e catupiry cremoso',preco:52.00,emoji:'🧀',foto:null},
  {id:4,categoria:'Pizza',nome:'Frango com Catupiry',desc:'Frango desfiado temperado, catupiry original e orégano',preco:48.00,emoji:'🍕',foto:null},
  {id:5,categoria:'Sobremesa',nome:'Pizza de Nutella',desc:'Base crocante com Nutella, morangos frescos e açúcar de confeiteiro',preco:38.00,emoji:'🍫',foto:null},
  {id:6,categoria:'Bebida',nome:'Coca-Cola 2L',desc:'Gelada e refrescante',preco:12.00,emoji:'🥤',foto:null},
  {id:7,categoria:'Bebida',nome:'Suco Natural 500ml',desc:'Laranja, limão ou maracujá — feito na hora',preco:10.00,emoji:'🍊',foto:null},
  {id:8,categoria:'Porção',nome:'Batata Frita Crocante',desc:'Porção generosa com sal grosso e molho especial da casa',preco:22.00,emoji:'🍟',foto:null}
];

const JOEY_SPLASH_URL = 'https://firebasestorage.googleapis.com/v0/b/gestaojoey.firebasestorage.app/o/clientes%2Fjoey%2Fsplash%2Fsplash?alt=media&token=95820007-1ee4-4572-a155-4a15ba15907f';

function configurarSplash(loja) {
  const splashImg = document.getElementById('splash-img');
  if (!splashImg) return;

  const url = loja?.splashUrl || (slug === 'joey' ? JOEY_SPLASH_URL : null) || loja?.logoUrl || null;

  if (url) {
    splashImg.src = url;
  } else {
    const splash = document.getElementById('splash');
    if (splash) splash.style.display = 'none';
    sessionStorage.setItem('splashShown', '1');
  }
}

// =================== CARREGAR DADOS DO PAINEL (FIREBASE) ===================
function carregarDadosPainel() {
  // Config em tempo real
  db.doc(`clientes/${slug}/config/loja`).onSnapshot(snap => {
    const cfg = snap.exists ? snap.data() : {};
    configurarSplash(cfg);
    CONFIG.nome     = cfg.nome     || 'Joey Pizza';
    CONFIG.wpp      = cfg.wpp      || '';
    CONFIG.taxa     = cfg.taxa     != null ? Number(cfg.taxa) : 5;
    CONFIG.end      = cfg.end      || '';
    CONFIG.bairros  = cfg.bairros  || [];
    CONFIG.horarios = cfg.horarios || {};
    CONFIG.aberto          = cfg.aberto          !== undefined ? cfg.aberto : true;
    CONFIG.tempo_delivery  = cfg.tempo_delivery  || '40-60 min';
    CONFIG.tempo_retirada  = cfg.tempo_retirada  || '20-30 min';
    CONFIG.tempo_local     = cfg.tempo_local     || '15-20 min';
    CONFIG.pedidoMinimo    = cfg.pedidoMinimo    || 0;
    CONFIG.destaque        = cfg.destaque        || null;
    CONFIG.premioJogo      = cfg.premioJogo      || '';   // frase do prêmio do jogo da cobrinha (editável no painel; ''=fallback)
    CONFIG.playlistMusica  = cfg.playlistMusica;   // 'PL…'=toca a playlist do próprio tenant | ''/undefined=sem música (aditivo off)
    CONFIG.playlistShuffle = cfg.playlistShuffle === true;   // true=embaralha (toggle do admin) | false/ausente=ordem da playlist
    _ytConfigReady = true; _maybeInitMusic();      // libera o player (Parte 2 — música por cliente)
    const heroLogo = document.getElementById('heroLogo');
    if (heroLogo) heroLogo.textContent = CONFIG.nome;
    const hero = document.querySelector('.hero');
    if (hero) hero.style.backgroundImage = cfg.bannerUrl
      ? `url('${cfg.bannerUrl}')`
      : "url('/joey_header.jpg')";
    atualizarStatusLoja();
  });

  // Receitas do Sistema Joey (segundo Firebase)
  let _recipesRaw = [];
  let _catalogoStatusMap = {};

  function buildCatalogo() {
    CARDAPIO.length = 0;
    _recipesRaw.forEach(r => {
      const _cat = r.categoria || 'Outros';
      if (_catsOcultas.has(_cat)) return;               // categoria oculta pelo gestor → some inteira do cardápio
      const _st = _catalogoStatusMap[r.id];
      if (_st?.ativo !== true) return;
      // Estoque do dia: campo number em catalogoStatus.estoque. null/ausente = ilimitado; <=0 some do cardápio.
      if (typeof _st.estoque === 'number' && _st.estoque <= 0) return;
      CARDAPIO.push({
        id:         r.id,
        nome:       r.name || r.nome || '—',
        categoria:  _cat,
        preco:      r.price || r.preco || 0,
        desc:       _catalogoStatusMap[r.id]?.descricaoCliente || r.desc || r.descricao || '', // descrição do cliente (gestor) > desc do recipe (compat)
        emoji:      r.emoji || EMOJI_CAT[r.categoria] || '🍽️',
        foto:       _catalogoStatusMap[r.id]?.foto || r.foto || r.image || null,
        adicionais: r.adicionais || [],
        adicionaisGrupos: r.adicionaisGrupos || []
      });
    });
    CATEGORIAS.length = 0;
    [...new Set(CARDAPIO.map(p => p.categoria))].forEach(c => CATEGORIAS.push(c));
    // Ordena pelo array dinâmico do gestor; fallback para CAT_ORDER do Firestore
    const _ord = _catOrdem.length ? _catOrdem : CAT_ORDER;
    CATEGORIAS.sort((a, b) => {
      const ia = _ord.indexOf(a), ib = _ord.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b, 'pt');
      if (ia === -1) return 1; if (ib === -1) return -1;
      return ia - ib;
    });
    if (!_catTouched || !CATEGORIAS.includes(catAtiva)) catAtiva = CATEGORIAS[0] || '';
    renderCats();
    renderProducts();
    renderPecaDeNovo();
    if (_catTouched) requestAnimationFrame(_spyActiveCat);
  }

  db.collection(`clientes/${slug}/recipes`).onSnapshot(snap => {
    _recipesRaw = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    buildCatalogo();
  }, () => {
    CARDAPIO.length = 0;
    CARDAPIO_PADRAO.forEach(p => CARDAPIO.push(p));
    CATEGORIAS.length = 0;
    [...new Set(CARDAPIO.map(p => p.categoria))].forEach(c => CATEGORIAS.push(c));
    const _ord = _catOrdem.length ? _catOrdem : CAT_ORDER;
    CATEGORIAS.sort((a, b) => {
      const ia = _ord.indexOf(a), ib = _ord.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b, 'pt');
      if (ia === -1) return 1; if (ib === -1) return -1;
      return ia - ib;
    });
    if (!_catTouched || !CATEGORIAS.includes(catAtiva)) catAtiva = CATEGORIAS[0] || '';
    renderCats();
    renderProducts();
  });

  db.collection(`clientes/${slug}/catalogoStatus`).onSnapshot(snap => {
    _catalogoStatusMap = {};
    snap.docs.forEach(d => { _catalogoStatusMap[d.id] = d.data(); });
    buildCatalogo();
  });

  // Ordem dinâmica definida pelo gestor
  db.doc(`clientes/${slug}/config/catOrdem`).onSnapshot(snap => {
    _catOrdem = snap.exists ? (snap.data().ordem || []) : [];
    _catsOcultas = new Set(snap.exists ? (snap.data().ocultas || []) : []);
    buildCatalogo();
  });
  db.doc(`clientes/${slug}/config/prodOrdem`).onSnapshot(snap => {
    _prodOrdem = snap.exists ? snap.data() : {};
    renderProducts();
  });

  db.collection(`clientes/${slug}/adicionais`).onSnapshot(snap => {
    _adicionaisCatalogo = {};
    snap.docs.forEach(d => { _adicionaisCatalogo[d.id] = { id: d.id, ...d.data() }; });
  }, () => {});

  db.collection(`clientes/${slug}/categorias`).onSnapshot(snap => {
    EMOJI_CAT = {};
    CAT_ORDER = [];
    snap.docs.forEach(d => {
      const data = d.data();
      if (data.nome) {
        EMOJI_CAT[data.nome] = data.emoji || '🍽️';
        CAT_ORDER.push(data.nome);
      }
    });
    CAT_ORDER.sort((a, b) => a.localeCompare(b, 'pt'));
    buildCatalogo();
  }, () => {});
}

// =================== iOS COMPAT HELPERS ===================
let _scrollLockY = 0;
function lockBodyScroll() {
  _scrollLockY = window.pageYOffset || 0;
  document.body.style.overflow   = 'hidden';
  document.body.style.position   = 'fixed';
  document.body.style.top        = '-' + _scrollLockY + 'px';
  document.body.style.width      = '100%';
}
function unlockBodyScroll() {
  document.body.style.overflow  = '';
  document.body.style.position  = '';
  document.body.style.top       = '';
  document.body.style.width     = '';
  window.scrollTo(0, _scrollLockY);
}
function scrollToSmooth(top) {
  if ('scrollBehavior' in document.documentElement.style) {
    window.scrollTo({ top, behavior: 'smooth' });
  } else {
    window.scrollTo(0, top);
  }
}

// =================== HORÁRIO / STATUS ===================

// Retorna um objeto Date cujos getHours()/getDay() refletem o horário de Brasília
// (America/Sao_Paulo, UTC-3), independente do timezone do navegador do cliente.
function _agoraBRT() {
  // toLocaleString('sv') com timezone SP devolve "YYYY-MM-DD HH:MM:SS" no horário local de SP.
  // Ao re-parsear como string sem offset, getHours()/getDay() retornam os valores de SP
  // em qualquer navegador, independente de configuração regional.
  const brtStr = new Date().toLocaleString('sv', { timeZone: 'America/Sao_Paulo' });
  return new Date(brtStr.replace(' ', 'T'));
}

function estaAberto() {
  if (CONFIG.aberto === false) return false;
  if (CONFIG.aberto === true && (!CONFIG.horarios || !Object.keys(CONFIG.horarios).length)) return true;
  const agora = _agoraBRT();
  const dia   = agora.getDay();
  const h     = (CONFIG.horarios || {})[dia];
  if (!h || !h.ativo) return false;
  const [hA, mA] = (h.abre  || '00:00').split(':').map(Number);
  const [hF, mF] = (h.fecha || '23:59').split(':').map(Number);
  const min = agora.getHours() * 60 + agora.getMinutes();
  return min >= hA * 60 + mA && min < hF * 60 + mF;
}

function horarioHoje() {
  const h = (CONFIG.horarios || {})[_agoraBRT().getDay()];
  if (!h || !h.ativo) return '';
  const fmt = t => t.replace(':', 'h');
  return `${fmt(h.abre)} – ${fmt(h.fecha)}`;
}

function proximoAbertura() {
  const horarios = CONFIG.horarios || {};
  const agora    = _agoraBRT();
  const hoje     = agora.getDay();
  const minAgora = agora.getHours() * 60 + agora.getMinutes();
  const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const fmt  = t => t.replace(':', 'h');
  const hHoje = horarios[hoje];
  if (hHoje && hHoje.ativo) {
    const [hA, mA] = (hHoje.abre || '00:00').split(':').map(Number);
    if (minAgora < hA * 60 + mA) return `Loja fechada · Abre hoje às ${fmt(hHoje.abre)}`;
  }
  for (let d = 1; d <= 7; d++) {
    const dia = (hoje + d) % 7;
    const h   = horarios[dia];
    if (h && h.ativo) {
      if (d === 1) return `Loja fechada · Abre amanhã às ${fmt(h.abre)}`;
      return `Loja fechada · Abre ${DIAS[dia]} às ${fmt(h.abre)}`;
    }
  }
  return 'Loja fechada no momento';
}

function atualizarStatusLoja() {
  const aberto   = estaAberto();
  const badge    = document.getElementById('heroBadge');
  const banner   = document.getElementById('bannerFechado');
  const heroInfo = document.getElementById('heroInfo');
  const bnavCart = document.getElementById('bnavCarrinho');

  // Linha de info: horário de hoje + pedido mínimo
  if (heroInfo) {
    const partes = [];
    const hor = horarioHoje();
    if (hor) partes.push(`🕐 Hoje: ${hor}`);
    if (CONFIG.pedidoMinimo > 0) partes.push(`Pedido mín. R$ ${CONFIG.pedidoMinimo.toFixed(2).replace('.',',')}`);
    heroInfo.innerHTML = partes.join(' <span class="hero-info-sep">·</span> ');
    heroInfo.style.display = partes.length ? '' : 'none';
  }

  if (aberto) {
    if (badge) {
      badge.style.background  = 'rgba(46,204,113,0.12)';
      badge.style.borderColor = 'rgba(46,204,113,0.3)';
      badge.style.color = '#2ecc71';
      badge.innerHTML = '<div class="dot-pulse"></div> Aberto agora · Delivery, Retirada e No local';
    }
    if (banner) banner.style.display = 'none';
    if (bnavCart) { bnavCart.style.opacity = ''; bnavCart.title = ''; }
  } else {
    if (badge) {
      badge.style.background  = 'rgba(231,76,60,0.12)';
      badge.style.borderColor = 'rgba(231,76,60,0.3)';
      badge.style.color = '#e74c3c';
      badge.innerHTML = '⛔ Fechado no momento';
    }
    if (banner) {
      banner.style.display = 'flex';
      const msg = document.getElementById('bannerHorario');
      if (msg) msg.textContent = proximoAbertura();
    }
    if (bnavCart) { bnavCart.style.opacity = '0.45'; bnavCart.title = 'Loja fechada no momento'; }
  }
}

function renderCats() {

function setCat(cat) {

  _catTouched = true;
  _spySuppressUntil = Date.now() + 800;  // nao deixa o scroll-spy brigar com o scroll suave do tap
  renderCats();

      const sec = document.getElementById('cat-' + cat);

// =================== SCROLL-SPY: o destaque acompanha a secao visivel ===================
// Destaca a pill da categoria cuja secao esta logo abaixo do nav fixo. Faz so toggle de
// classe (sem rebuild do nav) pra nao resetar o scroll horizontal das pills.
function _highlightActivePill() {
  const nav = document.getElementById('catNav');
  if (!nav) return;
  nav.querySelectorAll('.cat-pill').forEach(b => {
    const on = b.dataset.cat === catAtiva;
    b.classList.toggle('active', on);
    if (on) {
      const alvo = b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2;
      nav.scrollTo({ left: Math.max(0, alvo), behavior: 'smooth' });
    }
  });
}
function _spyActiveCat() {
  if (!CATEGORIAS.length || Date.now() < _spySuppressUntil) return;
  const navH = document.getElementById('catNav')?.offsetHeight || 56;
  const linha = navH + 12;
  let atual = CATEGORIAS[0];
  for (const c of CATEGORIAS) {
    const sec = document.getElementById('cat-' + c);
    if (!sec) continue;
    if (sec.getBoundingClientRect().top <= linha) atual = c; else break;
  }
  // perto do fim da pagina: ultima categoria (secoes curtas nunca alcancam o topo)
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
    atual = CATEGORIAS[CATEGORIAS.length - 1];
  }
  if (atual && atual !== catAtiva) { catAtiva = atual; _highlightActivePill(); }
}
window.addEventListener('scroll', () => {
  _catTouched = true;
  if (_spyRaf) return;
  _spyRaf = requestAnimationFrame(() => { _spyRaf = null; _spyActiveCat(); });
}, { passive: true });

function renderProducts() {
  const main = document.getElementById('mainContent');

  let destaqueHtml = '';
  if (CONFIG.destaque) {
    const pd = CARDAPIO.find(p => String(p.id) === String(CONFIG.destaque));
    if (pd) {
      const imgHtml = pd.foto
        ? `<img src="${pd.foto}" alt="${pd.nome}">`
        : `<span style="font-size:3rem">${pd.emoji}</span>`;
      destaqueHtml = `
        <div style="padding:1rem 1.5rem 0">
          <div class="destaque-card" onclick="openProduct('${pd.id}')">
            <div class="destaque-img">
              ${imgHtml}
              <span class="destaque-tag">⭐ Em destaque</span>
            </div>
            <div class="destaque-body">
              <div class="destaque-info">
                <div class="destaque-nome">${pd.nome}</div>
                <div class="destaque-desc">${pd.desc}</div>
              </div>
              <div class="destaque-right">
                <div class="destaque-preco">R$ ${pd.preco.toFixed(2).replace('.',',')}</div>
                <button class="destaque-btn" onclick="event.stopPropagation();openProduct('${pd.id}')">+</button>
              </div>
            </div>
          </div>
        </div>`;
    }
  }

  const catHtml = CATEGORIAS.map(cat => {
    let prods = CARDAPIO.filter(p => p.categoria === cat);
    const ordCat = _prodOrdem[cat];
    if (ordCat && ordCat.length) {
      prods = [...prods].sort((a, b) => {
        const ia = ordCat.indexOf(String(a.id)), ib = ordCat.indexOf(String(b.id));
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return 1; if (ib === -1) return -1;
        return ia - ib;
      });
    }
    return `
      <section class="section" id="cat-${cat}">
        <div class="section-title"><span>${EMOJI_CAT[cat]||'🍽️'}</span> ${cat}</div>
        <div class="products-grid">
          ${prods.map(p => prodCard(p)).join('')}
          ${prods.length===0?'<div class="empty-cat">Nenhum produto nessa categoria ainda.</div>':''}
        </div>
      </section>
    `;
  }).join('');

  main.innerHTML = destaqueHtml + catHtml;
}

function prodCard(p) {
  const imgHtml = p.foto
    ? `<img src="${p.foto}" alt="${p.nome}">`
    : `<span style="font-size:1.8rem">${p.emoji}</span>`;
  return `
    <div class="product-row" onclick="openProduct('${p.id}')">
      <div class="product-row-img">${imgHtml}</div>
      <div class="product-row-info">
        <div class="product-row-name">${p.nome}</div>
        ${p.desc ? `<div class="product-row-desc">${p.desc}</div>` : ''}
        <div class="product-row-price">R$ ${p.preco.toFixed(2).replace('.',',')}</div>
      </div>
    </div>
  `;
}

// =================== PRODUTO MODAL ===================
function openProduct(id, editIdx) {
  produtorModal = CARDAPIO.find(p => String(p.id) === String(id));
  if (!produtorModal) {
    if (editIdx != null) alert('Não foi possível abrir este item para edição (produto indisponível agora). Use o − / + para ajustar a quantidade.');
    return;
  }
  if (editIdx != null && cart[editIdx]) {
    // modo EDIÇÃO: reabre o produto pré-preenchido com a qtd e os adicionais que o item do carrinho já tinha
    const it = cart[editIdx];
    _editCartIdx = editIdx;
    qtyModal = it.qty || 1;
    obsModal = it.obs || '';
    adicionaisModal = {};
    (it.adicionais || []).forEach(a => { if (a && a.id != null) adicionaisModal[a.id] = a.qty || 0; });
  } else {
    _editCartIdx = null;
    qtyModal = 1;
    obsModal = '';
    adicionaisModal = {};
  }
  const _ovProd = document.getElementById('productOverlay');
  _ovProd.style.zIndex = (_editCartIdx != null) ? '300' : ''; // em edição: ACIMA do overlay do carrinho (z-index 200), senão fica escondido atrás
  _ovProd.classList.add('show');
  if (document.body.style.position !== 'fixed') lockBodyScroll(); // não re-trava (modal pode abrir sobre o carrinho já aberto)
  renderProductModal();
}

function renderProductModal() {
  const p = produtorModal;
  const imgHtml = p.foto
    ? `<div class="prod-modal-img"><img src="${p.foto}" alt="${p.nome}"></div>`
    : `<div class="prod-modal-img">${p.emoji}</div>`;

  // Grupos de opções (monte sua marmita)
  const grupos = Array.isArray(p.adicionaisGrupos) ? p.adicionaisGrupos : [];
  const idsEmGrupos = new Set();
  grupos.forEach(g => (g.itens || []).forEach(id => idsEmGrupos.add(String(id))));

  const gruposHtml = grupos.map(g => {
    const itens = (g.itens || []).map(id => _adicionaisCatalogo[id]).filter(Boolean);
    if (!itens.length) return '';
    const tipo = (Number(g.min) === 1 && Number(g.max) === 1) ? 'radio' : 'check';
    const max  = Math.max(1, Number(g.max) || 1);
    const obrig = !!g.obrigatorio || (Number(g.min) || 0) >= 1;
    const selCount = itens.filter(a => (adicionaisModal[a.id] || 0) > 0).length;
    const itensHtml = itens.map(a => {
      const sel  = (adicionaisModal[a.id] || 0) > 0;
      const pago = Number(a.preco || 0) > 0;
      const precoTxt = pago ? `+ R$ ${(a.preco).toFixed(2).replace('.', ',')}` : 'Incluso';
      const atMax = tipo === 'check' && !sel && selCount >= max;
      const acao  = tipo === 'radio' ? `selGrupoRadio('${g.id}','${a.id}')` : `toggleGrupoCheck('${g.id}','${a.id}')`;
      return `
        <label class="grupo-item${sel ? ' sel' : ''}${atMax ? ' dis' : ''}" onclick="${atMax ? '' : acao}">
          <span class="grupo-mark ${tipo}">${sel ? (tipo === 'radio' ? '●' : '✓') : ''}</span>
          <span class="grupo-item-nome">${a.nome}</span>
          <span class="grupo-item-preco${pago ? '' : ' incl'}">${precoTxt}</span>
        </label>`;
    }).join('');
    return `
      <div class="grupo-sec">
        <div class="grupo-head">
          <div class="grupo-title">${g.nome}</div>
          <div class="grupo-rule">${_grupoRegraCardapio(g)}${obrig ? ' <span class="grupo-obrig">Obrigatório</span>' : ''}</div>
        </div>
        ${itensHtml}
      </div>`;
  }).join('');

  // Adicionais avulsos (legado) — exclui os que já estão em grupos
  const idsAdicionais = (Array.isArray(p.adicionais) ? p.adicionais : []).filter(id => !idsEmGrupos.has(String(id)));
  const adicionaisDisponiveis = idsAdicionais.map(id => _adicionaisCatalogo[id]).filter(Boolean);

  const adicionaisHtml = adicionaisDisponiveis.length ? `
    <div class="adicionais-section">
      <div class="adicionais-title">Adicionais</div>
      ${adicionaisDisponiveis.map(a => {
        const qty = adicionaisModal[a.id] || 0;
        const max = a.qtdMax || 10;
        const pago = Number(a.preco || 0) > 0;
        return `
          <div class="adicional-row">
            <div class="adicional-info">
              <div class="adicional-nome">${a.nome}</div>
              <div class="adicional-preco">${pago ? `+ R$ ${(a.preco).toFixed(2).replace('.',',')}` : 'Incluso'}</div>
            </div>
            <div class="adicional-qty">
              <button class="qty-btn" onclick="changeAdicionalQty('${a.id}',-1)" ${qty===0?'disabled':''}>−</button>
              <span class="qty-num">${qty}</span>
              <button class="qty-btn" onclick="changeAdicionalQty('${a.id}',1)" ${qty>=max?'disabled':''}>+</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  ` : '';

  // Preço: soma TODOS os selecionados (inclusos = 0, não somam)
  const adicionaisTotal = Object.entries(adicionaisModal).reduce((s, [id, qty]) =>
    s + (qty || 0) * (_adicionaisCatalogo[id]?.preco || 0), 0);
  const totalModal = (p.preco + adicionaisTotal) * qtyModal;

  // Validação: grupos obrigatórios que ainda não atingiram o mínimo
  const pendentes = _gruposPendentes(p);
  const podeAdd = pendentes.length === 0;
  const emEdicao = _editCartIdx != null;
  const btnLabel = !podeAdd
    ? `Escolha: ${pendentes.join(', ')}`
    : `${emEdicao ? 'Salvar alterações' : 'Adicionar ao carrinho'} · R$ ${totalModal.toFixed(2).replace('.',',')}`;

  document.getElementById('productContent').innerHTML = `
    ${imgHtml}
    <div class="prod-modal-name">${p.nome}</div>
    ${p.desc ? `<div class="prod-modal-desc">${p.desc}</div>` : ''}
    <div class="prod-modal-price">R$ ${totalModal.toFixed(2).replace('.',',')}</div>
    <div class="qty-big">
      <button class="qty-btn" onclick="changeQtyModal(-1)">−</button>
      <span class="qty-num">${qtyModal}</span>
      <button class="qty-btn" onclick="changeQtyModal(1)">+</button>
    </div>
    ${gruposHtml}
    ${adicionaisHtml}
    <div class="form-group">
      <label class="form-label">Observações (opcional)</label>
      <textarea class="obs-input" placeholder="Ex: sem cebola, bem assada..." onchange="obsModal=this.value">${obsModal}</textarea>
    </div>
  `;
  document.getElementById('productFooter').innerHTML = `
    <button class="btn-main" onclick="${emEdicao ? 'salvarEdicaoCarrinho()' : 'addToCartFromModal()'}" ${podeAdd ? '' : 'disabled style="opacity:.5;cursor:not-allowed"'}>
      ${btnLabel}
    </button>
    <button class="btn-secondary" onclick="closeProduct()">Cancelar</button>
  `;
}

function changeAdicionalQty(id, d) {
  const a = _adicionaisCatalogo[id];
  if (!a) return;
  const max = a.qtdMax || 10;
  adicionaisModal[id] = Math.min(max, Math.max(0, (adicionaisModal[id] || 0) + d));
  renderProductModal();
}

// ---- Grupos de opções (monte sua marmita) ----
function _grupoRegraCardapio(g) {
  const min = Math.max(0, Number(g.min) || 0), max = Math.max(1, Number(g.max) || 1);
  if (min === max) return 'Escolha ' + min;
  if (min > 0)     return 'Escolha ' + min + ' a ' + max;
  return 'Escolha até ' + max;
}

// Grupos obrigatórios que ainda não atingiram o mínimo (retorna os nomes)
function _gruposPendentes(p) {
  const grupos = Array.isArray(p?.adicionaisGrupos) ? p.adicionaisGrupos : [];
  const faltam = [];
  grupos.forEach(g => {
    const itens = (g.itens || []).map(id => _adicionaisCatalogo[id]).filter(Boolean);
    if (!itens.length) return;
    const min = (!!g.obrigatorio) ? Math.max(1, Number(g.min) || 0) : (Number(g.min) || 0);
    if (min <= 0) return;
    const count = itens.filter(a => (adicionaisModal[a.id] || 0) > 0).length;
    if (count < min) faltam.push(g.nome || 'opção');
  });
  return faltam;
}

function _grupoById(gid) {
  const grupos = Array.isArray(produtorModal?.adicionaisGrupos) ? produtorModal.adicionaisGrupos : [];
  return grupos.find(g => String(g.id) === String(gid));
}

// Escolha única (radio): seleciona um item e zera os demais do grupo
function selGrupoRadio(gid, id) {
  const g = _grupoById(gid);
  if (!g) return;
  (g.itens || []).forEach(itId => { adicionaisModal[itId] = 0; });
  adicionaisModal[id] = 1;
  renderProductModal();
}

// Múltipla (checkbox): alterna respeitando o máximo do grupo
function toggleGrupoCheck(gid, id) {
  const g = _grupoById(gid);
  if (!g) return;
  const max = Math.max(1, Number(g.max) || 1);
  if ((adicionaisModal[id] || 0) > 0) {
    adicionaisModal[id] = 0;
  } else {
    const count = (g.itens || []).filter(itId => (adicionaisModal[itId] || 0) > 0).length;
    if (count >= max) return; // impede ultrapassar o máximo
    adicionaisModal[id] = 1;
  }
  renderProductModal();
}

function changeQtyModal(d) {
  qtyModal = Math.max(1, qtyModal + d);
  renderProductModal();
}

function addToCartFromModal() {
  const p = produtorModal;
  // bloqueia se algum grupo obrigatório não atingiu o mínimo
  const pendentes = _gruposPendentes(p);
  if (pendentes.length) { alert('Escolha as opções obrigatórias: ' + pendentes.join(', ')); return; }
  // mapa item -> nome do grupo (para a cozinha ler agrupado)
  const grupoDoItem = {};
  (Array.isArray(p.adicionaisGrupos) ? p.adicionaisGrupos : []).forEach(g =>
    (g.itens || []).forEach(id => { grupoDoItem[String(id)] = g.nome; }));
  const adicionaisSelecionados = Object.entries(adicionaisModal)
    .filter(([, qty]) => qty > 0)
    .map(([id, qty]) => {
      const a = _adicionaisCatalogo[id];
      if (!a) return null;
      const item = { id, nome: a.nome, preco: a.preco || 0, qty };
      if (grupoDoItem[String(id)]) item.grupo = grupoDoItem[String(id)];
      return item;
    })
    .filter(Boolean);
  const temAdicionais = adicionaisSelecionados.length > 0;
  const existing = !temAdicionais && cart.find(i => i.id === p.id && i.obs === obsModal && !(i.adicionais && i.adicionais.length));
  if (existing) {
    existing.qty += qtyModal;
  } else {
    cart.push({ id: p.id, nome: p.nome, preco: p.preco, qty: qtyModal, obs: obsModal, emoji: p.emoji, adicionais: adicionaisSelecionados });
  }
  updateCartBtn();
  renderProducts();

  const totalItens = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById('productFooter').innerHTML = `
    <div style="text-align:center;color:var(--success);font-weight:600;font-size:13px;margin-bottom:12px">
      ✓ Adicionado! (${totalItens} item${totalItens !== 1 ? 's' : ''} no carrinho)
    </div>
    <button class="btn-secondary" onclick="closeProduct()">🛒 Continuar comprando</button>
    <button class="btn-main" onclick="closeProduct();openCart()">✓ Confirmar pedido</button>
  `;
}

// Salva a edição POR CIMA do mesmo item do carrinho (mesma linha) — não duplica.
// Reaproveita exatamente a mesma montagem de adicionais do addToCartFromModal.
function salvarEdicaoCarrinho() {
  const p = produtorModal;
  const idx = _editCartIdx;
  if (idx == null || !cart[idx]) { closeProduct(); return; }
  const pendentes = _gruposPendentes(p);
  if (pendentes.length) { alert('Escolha as opções obrigatórias: ' + pendentes.join(', ')); return; }
  const grupoDoItem = {};
  (Array.isArray(p.adicionaisGrupos) ? p.adicionaisGrupos : []).forEach(g =>
    (g.itens || []).forEach(id => { grupoDoItem[String(id)] = g.nome; }));
  const adicionaisSelecionados = Object.entries(adicionaisModal)
    .filter(([, qty]) => qty > 0)
    .map(([id, qty]) => {
      const a = _adicionaisCatalogo[id];
      if (!a) return null;
      const it = { id, nome: a.nome, preco: a.preco || 0, qty };
      if (grupoDoItem[String(id)]) it.grupo = grupoDoItem[String(id)];
      return it;
    })
    .filter(Boolean);
  // ATUALIZA a mesma linha (preserva linhas distintas; recalcula preço pelo cartTotal/preço-da-linha)
  cart[idx] = { id: p.id, nome: p.nome, preco: p.preco, qty: qtyModal, obs: obsModal, emoji: p.emoji, adicionais: adicionaisSelecionados };
  updateCartBtn();
  renderProducts();
  closeProduct();            // fecha só o modal de produto; o carrinho continua aberto por baixo
  checkoutStep = 1;
  renderCartContent();       // volta pro carrinho com o item atualizado
}

function quickAdd(id) {
  const p = CARDAPIO.find(x => String(x.id) === String(id));
  if (!p) return;
  const existing = cart.find(i => String(i.id) === String(id) && !(i.adicionais && i.adicionais.length));
  if (existing) existing.qty++;
  else cart.push({id: p.id, nome: p.nome, preco: p.preco, qty: 1, obs: '', emoji: p.emoji, adicionais: []});
  updateCartBtn();
  renderProducts();
}

function closeProduct() {
  const _ovProd = document.getElementById('productOverlay');
  _ovProd.classList.remove('show');
  _ovProd.style.zIndex = '';   // volta ao z-index padrão (200)
  _editCartIdx = null;   // sai do modo edição (item preservado se fechou sem salvar)
  // só destrava o scroll se o carrinho NÃO estiver aberto por baixo (na edição, o carrinho continua aberto)
  if (!document.getElementById('cartOverlay')?.classList.contains('show')) unlockBodyScroll();
}

// =================== CARRINHO ===================
function updateCartBtn() {
  const total = cart.reduce((s, i) => s + i.qty, 0);
  const badge = document.getElementById('bnavBadge');
  if (badge) { badge.textContent = total; badge.classList.toggle('show', total > 0); }
  // marca o botão do nav como ativo quando há itens no carrinho
  if (total > 0) document.getElementById('bnavCarrinho')?.classList.add('has-items');
}

function cartTotal() {
  return cart.reduce((s, i) => {
    const adicionaisUnit = (i.adicionais || []).reduce((a, x) => a + x.preco * x.qty, 0);
    return s + (i.preco + adicionaisUnit) * i.qty;
  }, 0);
}

function openCart() {
  if (!estaAberto()) {
    alert(`⛔ ${proximoAbertura()}`);
    return;
  }
  checkoutStep = 1;
  renderCartContent();
  document.getElementById('cartOverlay').classList.add('show');
  lockBodyScroll();
}

function closeCart() {
  document.getElementById('cartOverlay').classList.remove('show');
  unlockBodyScroll();
}

function renderCartContent() {
  const sheet = document.getElementById('cartContent');
  if (checkoutStep === 1) renderStepCart(sheet);
  else if (checkoutStep === 2) renderStepDados(sheet);
  else if (checkoutStep === 3) renderStepPagamento(sheet);
  else if (checkoutStep === 4) renderStepSucesso(sheet);
}

// STEP 1: CARRINHO
function renderStepCart(el) {
  if (cart.length === 0) {
    el.innerHTML = `
      <div class="sheet-title">Seu Carrinho</div>
      <div style="text-align:center;padding:2rem;color:var(--text3);">

      <button class="btn-secondary" onclick="closeCart()">← Voltar ao cardápio</button>
    `;
    return;
  }
  const itens = cart.map((i, idx) => {
    const adicionaisUnit = (i.adicionais || []).reduce((a, x) => a + x.preco * x.qty, 0);
    const adicionaisHtml = (i.adicionais || []).filter(a => a.qty > 0).map(a =>
      `<div style="font-size:11px;color:var(--text2)">+ ${a.qty}x ${a.nome}</div>`
    ).join('');
    return `
    <div class="cart-item">

        <span style="font-size:1.3rem">${i.emoji}</span>

          <div class="cart-item-name">${i.nome} <span style="font-size:10px;color:var(--orange);font-weight:600">✏️ editar</span></div>
          ${adicionaisHtml}
          ${i.obs ? `<div style="font-size:11px;color:var(--text3)">📝 ${i.obs}</div>` : ''}
        </div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeCartQty('${i.id}',-1)">−</button>
        <span class="qty-num">${i.qty}</span>
        <button class="qty-btn" onclick="changeCartQty('${i.id}',1)">+</button>
      </div>
      <div class="cart-item-price">R$ ${((i.preco + adicionaisUnit) * i.qty).toFixed(2).replace('.',',')}</div>
    </div>

  }).join('');

  el.innerHTML = `
    <div class="steps">

    <div class="sheet-title">Seu Carrinho 🛒</div>
    ${itens}
    <div class="cart-total">
      <span>Total</span>
      <span>R$ ${cartTotal().toFixed(2).replace('.',',')}</span>
    </div>
    <button class="btn-main" onclick="goStep(2)">Continuar →</button>
    <button class="btn-secondary" onclick="closeCart()">← Continuar comprando</button>

}

function changeCartQty(id, d) {
  const i = cart.find(x => String(x.id) === String(id));
  if (!i) return;
  i.qty += d;
  if (i.qty <= 0) cart = cart.filter(x => x !== i);
  updateCartBtn();
  renderProducts();
  renderCartContent();
}

// Endereço de entrega salvo por tenant (isolado por slug)
function _enderecoSalvo() {
  try { return JSON.parse(localStorage.getItem('joey_endereco_' + slug) || 'null'); }
  catch(e) { return null; }
}

// PARTE 2 — pré-preenchimento via token do WhatsApp. Resolve ?t= (ou token salvo no
// localStorage) → nome+endereço por uma Cloud Function (server-side; o anônimo não lê
// tokens/clientes direto). Grava no MESMO localStorage que o checkout já lê → totalmente
// editável e o "Entregar em outro endereço?" (limparEndereco) continua funcionando.
// Telefone verificado do WhatsApp (via token): quando o nº real vem do bot, o campo é preenchido + travado.
let _telVerificado = false;
function _fmtTelBR(d) {
  d = String(d || '').replace(/\D/g, '');
  if (d.length > 11 && d.slice(0, 2) === '55') d = d.slice(2); // tira código país, se vier
  if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return d;
}
// "usar outro número": destrava o campo pra edição manual (caso raro) sem re-renderizar (preserva o resto)
function _usarOutroTelefone() {
  _telVerificado = false;
  const campo = document.getElementById('fTel');
  if (campo) { campo.readOnly = false; campo.value = ''; campo.focus(); }
  const wrap = document.getElementById('telVerificadoWrap');
  if (wrap) wrap.style.display = 'none';
}

// Toast curto (usado quando chega um carrinho montado pela IA do WhatsApp)
function _toastCarrinhoIA(msg) {
  try {
    const t = document.createElement('div');
    t.textContent = msg || 'Pedido do WhatsApp carregado!';
    t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:9999;'
      + 'background:#E87722;color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;font-weight:600;'
      + 'box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:90vw;text-align:center;opacity:0;transition:opacity .25s';
    document.body.appendChild(t);
    requestAnimationFrame(() => { t.style.opacity = '1'; });
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
  } catch (e) {}
}

async function _resolverTokenEndereco() {
  try {
    const lsKey = 'joey_linktoken_' + slug;
    let token = '';
    try { token = new URLSearchParams(location.search).get('t') || ''; } catch(e){}
    if (token) { try { localStorage.setItem(lsKey, token); } catch(e){} }     // veio do link → memoriza
    else { try { token = localStorage.getItem(lsKey) || ''; } catch(e){} }     // visita seguinte sem ?t=
    if (!token) return;                                                        // sem token → digita tudo (atual)

    const resp = await fetch(_CF_RESOLVE_TOKEN, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, token })
    });
    const data = await resp.json().catch(() => null);
    if (!data || !data.ok) return;

    // Nome — não sobrescreve o que o cliente já tem
    if (data.nome) {
      if (!clienteData) clienteData = {};
      if (!clienteData.nome) clienteData.nome = data.nome;
      try {
        const cli = JSON.parse(localStorage.getItem('joey_cliente') || 'null') || {};
        if (!cli.nome) { cli.nome = data.nome; localStorage.setItem('joey_cliente', JSON.stringify(cli)); }
      } catch(e){}
    }
    // Endereço — COMPLEMENTA o localStorage atual (campo a campo; mantém o que já houver no device)
    if (data.endereco) {
      const e = data.endereco;
      const atual = _enderecoSalvo() || {};
      const novo = {
        rua:    atual.rua    || e.rua    || '',
        numero: atual.numero || e.numero || '',
        comp:   atual.comp   || e.comp   || '',
        ref:    atual.ref    || e.ref    || '',
        bairro: atual.bairro || e.bairro || '',
      };
      try { localStorage.setItem('joey_endereco_' + slug, JSON.stringify(novo)); } catch(e){}
    }
    // Telefone verificado do WhatsApp — número real (10-13 díg) ou '' (@lid sem número). '' → não mexe no campo.
    if (typeof data.telefone === 'string' && data.telefone) {
      const telFmt = _fmtTelBR(data.telefone);
      if (telFmt) {
        _telVerificado = true;
        if (!clienteData) clienteData = {};
        clienteData.tel = telFmt;   // número do WhatsApp tem prioridade (é o verificado do cliente)
        try {
          const cli = JSON.parse(localStorage.getItem('joey_cliente') || 'null') || {};
          cli.tel = telFmt; localStorage.setItem('joey_cliente', JSON.stringify(cli));
        } catch(e){}
      }
    }
    // Carrinho montado pela IA no WhatsApp (Fase 2 Opção B) — vem no MESMO retorno do token.
    // Injeta UMA vez, só se o carrinho local estiver vazio (não duplica em reload). A estrutura
    // do item já é idêntica à do cart[] do site (id/nome/preco/qty/obs/emoji/adicionais).
    try {
      const _iaItens = (data.carrinho && Array.isArray(data.carrinho.itens)) ? data.carrinho.itens : [];
      console.log('[carrinho IA] recebido do WhatsApp:', _iaItens.length, 'item(ns) | cart local:', cart.length);
      if (_iaItens.length && cart.length === 0) {
        _iaItens.forEach(it => {
          cart.push({
            id: it.id,
            nome: it.nome,
            preco: Number(it.preco) || 0,
            qty: Number(it.qty) || 1,
            obs: it.obs || '',
            emoji: it.emoji || '🍽️',
            adicionais: Array.isArray(it.adicionais) ? it.adicionais : []
          });
        });
        if (typeof updateCartBtn === 'function') updateCartBtn();
        if (typeof renderProducts === 'function') renderProducts();
        // Abre a SACOLA automaticamente p/ o cliente VER o pedido carregado (sem ser silencioso).
        // Mostra a sacola direto (sem o guard de loja fechada do openCart) — só exibir os itens.
        try {
          checkoutStep = 1;
          if (typeof renderCartContent === 'function') renderCartContent();
          const _ov = document.getElementById('cartOverlay');
          if (_ov) { _ov.classList.add('show'); if (typeof lockBodyScroll === 'function') lockBodyScroll(); }
        } catch (e2) { console.warn('[carrinho IA] abrir sacola falhou:', e2); }
        _toastCarrinhoIA('Pedido do WhatsApp carregado! 🛒');
        console.log('[carrinho IA] injetado:', cart.length, 'item(ns) no carrinho');
      } else if (_iaItens.length) {
        console.log('[carrinho IA] cart local NÃO vazio — injeção pulada (evita duplicar)');
      }
    } catch (e) { console.warn('[carrinho IA]', e); }

    // Se o cliente já está na etapa de dados, re-renderiza pra refletir (campos editáveis)
    if (checkoutStep === 2 && typeof renderCartContent === 'function') {
      try { renderCartContent(); } catch(e){}
    }
  } catch (e) { console.warn('[token endereço]', e); }
}

function _salvarEnderecoTenant() {
  if (!clienteData || !clienteData.rua) return;
  try {
    localStorage.setItem('joey_endereco_' + slug, JSON.stringify({
      rua:    clienteData.rua    || '',
      numero: clienteData.numero || '',
      bairro: clienteData.bairro || '',
      comp:   clienteData.comp   || '',
      ref:    clienteData.ref    || ''
    }));
  } catch(e) {}
}

function limparEndereco() {
  ['fRua','fNumero','fComp','fRef'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const sn = document.getElementById('fSemNumero');
  if (sn) sn.checked = false;
  const num = document.getElementById('fNumero');
  if (num) { num.disabled = false; num.style.opacity = ''; }
  const fb = document.getElementById('fBairro');
  if (fb) fb.value = '';
  bairroSelecionado = null;
  const taxaInfo = document.getElementById('taxaInfo');
  if (taxaInfo) taxaInfo.style.display = 'none';
}

// "Sem número": desabilita o campo Número (gravará "S/N"); desmarcado, volta a exigir número
function onSemNumero(cb) {
  const num = document.getElementById('fNumero');
  if (!num) return;
  if (cb.checked) { num.value = ''; num.disabled = true; num.style.opacity = '.5'; }
  else { num.disabled = false; num.style.opacity = ''; num.focus(); }
}

function confirmarDados() {
  const nome = document.getElementById('fNome').value.trim();
  const tel  = document.getElementById('fTel').value.trim();
  if (!nome || !tel) { alert('Por favor, preencha seu nome e WhatsApp.'); return; }
  if (!tipoEntrega)  { alert('Selecione o tipo de entrega.'); return; }
  if (tipoEntrega === 'delivery') {
    const minimo = CONFIG.pedidoMinimo || 0;
    if (minimo > 0 && cartTotal() < minimo) {
      _atualizarMinimoWarning();
      alert(`Valor mínimo para delivery é R$ ${minimo.toFixed(2).replace('.',',')}.\nAdicione mais itens ao carrinho.`);
      return;
    }
    const rua    = document.getElementById('fRua').value.trim();
    const semNum = document.getElementById('fSemNumero')?.checked;
    const numero = semNum ? 'S/N' : (document.getElementById('fNumero')?.value.trim() || '');
    const fBairro = document.getElementById('fBairro');
    const bairro  = fBairro ? fBairro.value.trim() : '';
    const ref     = document.getElementById('fRef').value.trim();
    if (!rua)    { alert('Por favor, preencha a rua.'); return; }
    if (!numero) { alert('Por favor, preencha o número (ou marque "Sem número").'); return; }
    if (!bairro) { alert('Por favor, selecione o bairro.'); return; }
    if (!ref)    { alert('Por favor, preencha o ponto de referência (ajuda o entregador a achar).'); return; }
    // Se bairroSelecionado ainda não foi definido (digitação livre sem lista)
    if (!bairroSelecionado && CONFIG.bairros.length === 0) {
      bairroSelecionado = { nome: bairro, taxa: CONFIG.taxa };
    }
    clienteData = {
      nome, tel, rua, numero,
      bairro: bairroSelecionado ? bairroSelecionado.nome : bairro,
      taxaBairro: bairroSelecionado ? bairroSelecionado.taxa : CONFIG.taxa,
      comp: document.getElementById('fComp').value.trim(),
      ref:  ref
    };
  } else {
    bairroSelecionado = null;
    clienteData = { nome, tel };
    if (tipoEntrega === 'local') clienteData.mesa = sessionStorage.getItem('mesaAtiva') || document.getElementById('fMesa')?.value.trim() || '';
  }
  try{ localStorage.setItem('joey_cliente', JSON.stringify(clienteData)); }catch(e){}
  salvarCarrinhoAbandonado(clienteData);
  goStep(3);
}

      qty: item.qty

    await db.collection(`clientes/${slug}/carrinhos`).doc('tel_' + clienteData.tel.replace(/\D/g, '')).set({

// idempotência: mesmo id de tentativa enquanto for a mesma intenção de pedido
let _pedidoReqId = null;
function _novoReqId() {
  return 'req_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}
// roda a transação do contador com retry + backoff curto SÓ em erros transitórios de rede
function _txComRetry(updateFn, maxTentativas) {
  maxTentativas = maxTentativas || 4;
  const transitorios = ['unavailable', 'deadline-exceeded', 'aborted', 'internal', 'cancelled', 'resource-exhausted'];
  const tentar = (n) => db.runTransaction(updateFn).catch(err => {
    const code = (err && err.code ? String(err.code) : '').replace('firestore/', '');
    if (n < maxTentativas && transitorios.indexOf(code) !== -1) {
      const espera = 300 * Math.pow(2, n - 1); // 300ms, 600ms, 1200ms...
      console.warn('[finalizarPedido] transação falhou (' + code + ') — tentativa ' + n + '/' + maxTentativas + ', repetindo em ' + espera + 'ms');
      return new Promise(res => setTimeout(res, espera)).then(() => tentar(n + 1));
    }
    throw err;
  });
  return tentar(1);
}
// garante uma sessão anônima VÁLIDA (token renovado) antes de gravar — evita permission-denied por sessão stale/vencida em cache
async function _garantirAuthValida() {
  const auth = firebase.auth();
  if (!auth.currentUser) {
    await auth.signInAnonymously(); // sem usuário em cache → cria sessão anônima
  }
  try {
    await auth.currentUser.getIdToken(true); // força renovação do token
  } catch (e) {
    // token irrecuperável (conta anônima reciclada/inválida) → refaz a sessão do zero
    console.warn('[finalizarPedido] token anônimo irrecuperável, refazendo login:', (e && e.code) || '', (e && e.message) || e);
    await auth.signInAnonymously();
    await auth.currentUser.getIdToken(true);
  }
  if (!auth.currentUser) throw new Error('sem-auth');
  return auth.currentUser;
}

function finalizarPedido() {
  if (!formaPag) { alert('Selecione a forma de pagamento.'); return; }
  if (formaPag === 'balcao') formaPag = 'local'; // mesa: pagamento no balcão — registra como 'local'
  const btn = document.getElementById('btnFinalizar');
  btn.textContent = 'Enviando pedido...';
  btn.disabled = true;

  const troco = formaPag==='dinheiro' && document.getElementById('fTroco')
    ? parseFloat(document.getElementById('fTroco').value)||0 : 0;

  // mesmo reqId enquanto for a mesma intenção (reusado nas re-tentativas; zerado só no sucesso)
  if (!_pedidoReqId) _pedidoReqId = _novoReqId();
  const reqId = _pedidoReqId;

  const pedidosRef = db.collection(`clientes/${slug}/pedidos`);
  const contadorRef = db.doc(`clientes/${slug}/config/contador`);

  // 0) garante sessão anônima válida (token renovado) ANTES de qualquer leitura/escrita
  _garantirAuthValida()
    // 1) idempotência: se uma tentativa anterior (mesmo reqId) já gravou, NÃO duplica — trata como sucesso
    .then(() => pedidosRef.where('reqId', '==', reqId).limit(1).get())
    .then(snap => {
      if (!snap.empty) {
        const doc = snap.docs[0];
        console.warn('[finalizarPedido] pedido com reqId ' + reqId + ' já existe (id ' + doc.id + ') — tentativa anterior commitou, seguindo sem duplicar');
        return doc.data();
      }
      // 2) gera o número sequencial via transação no contador, com retry/backoff em falhas transitórias
      return _txComRetry(t => {
        return t.get(contadorRef).then(doc => {
          const atual = doc.exists ? (doc.data().ultimoPedido || 0) : 0;
          const novo = atual + 1;
          t.set(contadorRef, { ultimoPedido: novo }, { merge: true });
          return novo;
        });
      }).then(novoId => {
        const pedido = {
          id: String(novoId),
          reqId: reqId,
          ts: Date.now(),
          hora: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
          data: new Date().toLocaleDateString('pt-BR'),
          cliente: clienteData,
          itens: cart,
          subtotal: cartTotal(),
          entrega: tipoEntrega,
          taxaEntrega: taxaEntregaAtual(),
          total: cartTotal() + taxaEntregaAtual(),
          pagamento: formaPag,
          troco: troco,
          status: 'novo',
          ...(sessionStorage.getItem('mesaAtiva') ? { mesa: sessionStorage.getItem('mesaAtiva') } : {}),
          ...(formaPag === 'pix' ? { pixStatus: 'aguardando_geracao', cardapioOrigin: location.origin } : {})
        };
        return pedidosRef.doc(pedido.id).set(pedido).then(() => pedido);
      });
    })
    .then(pedido => {
      ultimoPedido = pedido;
      const _mesaAtiva = sessionStorage.getItem('mesaAtiva');
      if (_mesaAtiva) atualizarMesaComPedido(pedido, _mesaAtiva);
      if (formaPag !== 'pix' && !_mesaAtiva && !pedido.mesa) enviarWhatsApp(pedido);
      cart = [];
      updateCartBtn();
      renderProducts();
      checkoutStep = 4;
      marcarCarrinhoConvertido(clienteData?.tel);
      _salvarEnderecoTenant();
      renderCartContent();
      _pedidoReqId = null; // intenção concluída → próximo pedido gera novo reqId
    })
    .catch(err => {
      const code = (err && err.code) ? String(err.code) : '';
      const msg  = (err && err.message) ? err.message : String(err);
      console.error('[finalizarPedido] FALHA ao enviar pedido — code:', code || '(sem código)', '| message:', msg, err);
      btn.textContent = '✓ Finalizar Pedido';
      btn.disabled = false;
      let aviso;
      if (msg === 'sem-auth' || code.indexOf('auth/') !== -1) {
        aviso = 'Não foi possível te identificar. Atualize a página (puxe a tela para baixo) e finalize novamente.';
      } else if (code.indexOf('permission-denied') !== -1) {
        aviso = 'Não foi possível enviar o pedido (permissão negada). Atualize a página e tente de novo. Se continuar, chame o restaurante.';
      } else if (code.indexOf('unauthenticated') !== -1) {
        aviso = 'Sua sessão expirou. Atualize a página (puxe a tela para baixo) e finalize novamente.';
      } else if (code.indexOf('unavailable') !== -1 || code.indexOf('deadline') !== -1) {
        aviso = 'Conexão instável — não conseguimos confirmar o pedido após várias tentativas. Verifique a internet e toque em Finalizar novamente.';
      } else {
        aviso = 'Não foi possível enviar o pedido. Toque em Finalizar novamente. Se continuar, chame o restaurante.' + (code ? ' (cód: ' + code + ')' : '');
      }
      alert(aviso);
    });
}

function atualizarMesaComPedido(pedido, mesaNum) {
  const mesaRef = db.doc(`clientes/${slug}/mesas/mesa-${mesaNum}`);
  const itensMesa = (pedido.itens || []).map(i => ({
    id: i.id,
    nome: i.nome,
    preco: i.preco,
    qty: i.qty,
    adicionais: (i.adicionais || []).map(a => ({ id: a.id, nome: a.nome, preco: a.preco || 0, qty: a.qty || 1, ...(a.grupo ? { grupo: a.grupo } : {}) })),
    obs: i.obs || ''
  }));
  const subtotal = pedido.subtotal || 0;
  mesaRef.get().then(doc => {
    const m = doc.exists ? doc.data() : {};
    const pedidosMesa = [...(m.pedidos || [])];
    pedidosMesa.push({ itens: itensMesa, subtotal, obs: '', hora: pedido.hora, pedidoId: pedido.id });
    const total = pedidosMesa.reduce((s, p) => s + (p.subtotal || 0), 0);
    return mesaRef.set({ status: 'ocupada', pedidos: pedidosMesa, total }, { merge: true });
  }).catch(e => console.warn('[mesa sync]', e));
}

function enviarWhatsApp(pedido) {
  const numeroEstabelecimento = CONFIG.wpp || '5500000000000';

  const itensTexto = pedido.itens.map(i => {

    if (i.adicionais && i.adicionais.length > 0) {
      linha += '\n' + i.adicionais.map(a => `  + ${a.grupo ? a.grupo + ': ' + a.nome : a.qty + 'x ' + a.nome}`).join('\n');
    }
    return linha;
  }).join('\n');

  const enderecoTexto = pedido.entrega === 'delivery'

    : pedido.entrega === 'local'

  const trocoTexto = pedido.pagamento==='dinheiro' && pedido.troco>0
    ? `\n💵 Troco para: R$ ${pedido.troco.toFixed(2).replace('.',',')}`:'';

  const msg = `🍕 *NOVO PEDIDO — ${CONFIG.nome}*
━━━━━━━━━━━━━━━━
🆔 Pedido: *#${pedido.id}*
⏰ Horário: ${pedido.hora}

👤 *Cliente:* ${pedido.cliente.nome}
📱 *WhatsApp:* ${pedido.cliente.tel}

━━━━━━━━━━━━━━━━
🛒 *ITENS DO PEDIDO:*
${itensTexto}

━━━━━━━━━━━━━━━━
${enderecoTexto}

💳 *Pagamento:* ${pedido.pagamento.toUpperCase()}${trocoTexto}
💰 *Total:* R$ ${pedido.total.toFixed(2).replace('.',',')}
━━━━━━━━━━━━━━━━`;
