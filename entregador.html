<style>
  :root{--bg:#0f0f0f;--card:#1a1a1a;--card2:#222;--border:#2e2e2e;--orange:#ff6b35;--orange2:#ff8c5a;--text:#f0ede8;--text2:#9a9a9a;--text3:#5a5a5a;--green:#34d399;--ok:#2ecc71}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:#141414;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px}
  header .logo{font-weight:800;color:var(--orange);font-size:18px;letter-spacing:.3px}
  header .who{margin-left:auto;font-size:13px;color:var(--text2);text-align:right;line-height:1.3}
  header .who b{color:var(--text);display:block;font-size:14px}
  .wrap{max-width:560px;margin:0 auto;padding:14px}
  .live{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;margin:2px 2px 12px}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .num{font-weight:800;font-size:17px;color:var(--text)}
  .pill{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-left:auto}
  .pill-rota{background:rgba(255,107,53,.15);color:var(--orange)}
  .pill-fila{background:#2a2a2a;color:var(--text2)}
  .cli{font-size:16px;font-weight:700;margin-bottom:2px}
  .end{font-size:14px;color:var(--text);line-height:1.45;margin:6px 0}
  .end .ref{color:var(--orange)}
  .gps-cli{font-size:12.5px;font-weight:700;color:#38bdf8;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);border-radius:8px;padding:6px 9px;margin:4px 0 6px}
  .tel{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--orange2);text-decoration:none;font-weight:600;margin:2px 0 8px}
  .itens{font-size:13px;color:var(--text2);line-height:1.5;border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
  .pag{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:14px}
  .pag .total{font-weight:800;font-size:18px;color:var(--text)}
  .pag .receber{color:#ffd27a;font-weight:700}
  .pag .pago{color:var(--green);font-weight:700}
  .btns{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;border:none;border-radius:12px;padding:15px 10px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:7px}
  .btn-rota{background:#243447;color:#7cc4ff;border:1px solid #2f4763}
  .btn-ok{background:var(--orange);color:#fff}
  .btn-ok:active{filter:brightness(.9)}
  .btn[disabled]{opacity:.5}
  /* Código de entrega do iFood (entrega própria): o iFood valida e só então o pedido conclui */
  .ifood-tag{font-size:11px;font-weight:800;color:#ea1d2c;margin:0 0 4px}
  .cod{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .cod input{width:100%;background:var(--card2);color:var(--text);border:1px solid #5a2a2e;border-radius:12px;padding:14px;font-size:20px;font-weight:800;letter-spacing:6px;text-align:center;font-family:inherit}
  .cod input::placeholder{letter-spacing:normal;font-size:15px;font-weight:600;color:var(--text3)}
  .cod .btn-ifood{background:#ea1d2c;color:#fff}
  .tag99{font-size:11px;font-weight:800;color:#facc15;margin:0 0 4px}
  .loc99{font-size:13px;color:var(--text);background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.35);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.5}
  .loc99 a{color:#facc15;font-weight:700}
  .cod .btn-99{background:#facc15;color:#1a1a1a}
  .cod .erro{font-size:13.5px;color:#ff7b7b;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:9px 11px;line-height:1.4}
  .cod .dica{font-size:12px;color:var(--text2);line-height:1.4}
  /* Menu de escolha do app de rota (parte do GPS do motoboy) */
  .rota-sheet{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}
  .rota-sheet.show{display:flex}
  .rota-card{background:var(--card);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .rota-title{font-size:14px;color:var(--text2);text-align:center;margin-bottom:4px}
  .rota-status{font-size:12px;font-weight:700;text-align:center;margin-bottom:6px;min-height:16px}
  .rota-opt{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:16px;font-size:16px;font-weight:800;text-decoration:none}
  .rota-opt:active{filter:brightness(1.25)}
  .rota-cancel{background:none;border:none;color:var(--text2);font-size:15px;font-weight:700;padding:12px;font-family:inherit;cursor:pointer}
  .estado{text-align:center;padding:48px 20px;color:var(--text2)}
  .estado .big{font-size:42px;margin-bottom:10px}
  .estado.neutro .big{filter:grayscale(1)}
  .skel{height:120px;background:linear-gradient(90deg,#181818,#202020,#181818);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:16px;margin-bottom:14px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
  <header>
    <span class="logo">🛵 Joey Entregas</span>
    <span class="who" id="who"></span>
  </header>
  <div class="wrap">
    <div class="live" id="live" style="display:none"><span class="dot"></span> Atualizando em tempo real</div>
    <div id="conteudo"><div class="skel"></div><div class="skel"></div></div>
  </div>

  <!-- Menu de escolha do app de rota. origin = GPS real do motoboy (fallback: sem origem) -->
  <div id="rotaSheet" class="rota-sheet" onclick="if(event.target===this)fecharRota()">
    <div class="rota-card">
      <div class="rota-title">Abrir rota com…</div>
      <div class="rota-status" id="rotaStatus"></div>
      <a class="rota-opt" id="rotaGoogle" href="#" onclick="return abrirApp('google')">🗺️ Google Maps</a>
      <a class="rota-opt" id="rotaWaze"   href="#" onclick="return abrirApp('waze')">🚗 Waze</a>
      <a class="rota-opt" id="rotaApple"  href="#" onclick="return abrirApp('apple')">🍎 Apple Maps</a>
      <button class="rota-cancel" onclick="fecharRota()">Cancelar</button>
    </div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA8yx0BXHDZee_RyLteJbSuQDzInj-GpFM",
  authDomain: "gestaojoey.firebaseapp.com",
  projectId: "gestaojoey",
  storageBucket: "gestaojoey.firebasestorage.app",
  messagingSenderId: "372331148907",
  appId: "1:372331148907:web:aa5eb48d309a167ad1a32e"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const fns = firebase.app().functions('southamerica-east1');

// /entregador/{slug} → pega o último segmento do caminho
const _segs = location.pathname.split('/').filter(Boolean);
const SLUG = (_segs[0] === 'entregador' ? _segs[1] : _segs[_segs.length - 1]) || '';

let entregadorId = null, _unsub = null;
// Serviço joey-ifood: valida o código de entrega no iFood (mesma rota do painel; aceita o token do entregador).
const IFOOD_API = 'https://joey-ifood-production.up.railway.app';
let tenant = null;   // (Bloco 2) slug do TENANT (resolvido pelo entregadorAuth) — antes era hardcoded 'joey'
let _lojaGeo = { cidade: '', estado: '' };   // cidade/estado do tenant (config/loja) p/ compor o destino da rota
const $ = (id) => document.getElementById(id);
// Texto → HTML (conteúdo e atributo). Valor que vai para um onclick NÃO entra como string JS: vai em data-* e o handler
// lê this.dataset (o navegador desfaz o &#39; ANTES de rodar o JS — escapar não protege string dentro do onclick).
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function telaNeutra() {
  if (_unsub) { _unsub(); _unsub = null; }
  $('live').style.display = 'none';
  $('who').textContent = '';
  $('conteudo').innerHTML = `<div class="estado neutro"><div class="big">🔒</div><div>Link inválido ou expirado.</div><div style="font-size:13px;color:var(--text3);margin-top:8px">Confira o endereço com a pizzaria.</div></div>`;
}

async function init() {
  if (!SLUG || SLUG === 'entregador') return telaNeutra();
  try {
    const res = await fns.httpsCallable('entregadorAuth')({ slug: SLUG });
    const d = res.data || {};
    if (!d.token || !d.entregadorId) return telaNeutra();
    await auth.signInWithCustomToken(d.token);
    entregadorId = d.entregadorId;
    tenant = d.tenant || 'joey';   // (Bloco 2) tenant resolvido pelo entregadorAuth (fallback joey p/ compat)
    // cidade/estado do tenant p/ compor o destino da rota (config/loja tem leitura pública)
    try {
      const lj = (await db.doc('clientes/' + tenant + '/config/loja').get()).data() || {};
      _lojaGeo = { cidade: lj.cidade || '', estado: lj.estado || '' };
      // Motoboy de qualquer restaurante (desde 15/10/2026): o cabeçalho leva o nome da loja; o Joey continua "Joey Entregas".
      if (tenant !== 'joey' && lj.nome) {
        const logo = document.querySelector('.logo');
        if (logo) logo.textContent = '🛵 ' + lj.nome + ' · Entregas';
        document.title = 'Entregas · ' + lj.nome;
      }
    } catch (_) {}
    $('who').innerHTML = `<b>${esc(d.nome || 'Entregador')}</b>suas entregas`;
    escutarPedidos();
  } catch (e) {
    // slug inválido/inativo → erro neutro, sem vazar nada
    telaNeutra();
  }
}

function escutarPedidos() {
  $('live').style.display = 'flex';
  _unsub = db.collection('clientes/' + tenant + '/pedidos').where('entregadorId', '==', entregadorId).onSnapshot(snap => {
    const ativos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(p => p.status !== 'finalizado' && p.status !== 'cancelado')
      .sort((a, b) => (_ms(a.atribuidoEm) - _ms(b.atribuidoEm)));   // mais antigo primeiro = entregar antes
    render(ativos);
  }, err => { console.warn('[entregador] listener:', err && err.message); telaNeutra(); });
}
function _ms(ts) { return ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0); }

function enderecoTxt(c) {
  if (!c) return '';
  const l1 = [c.rua, c.numero].filter(Boolean).join(', ');
  return [l1, c.bairro].filter(Boolean).join(' · ');
}
// DESTINO — por ordem de confiança:
//   1. GPS do CLIENTE (gpsLat/gpsLng, mandado do cardápio quando ele estava no local, ≤100 m de
//      precisão): é onde ele está, não o que o Google entendeu do endereço digitado;
//   2. geocodificação que achou a CASA (geoPrecisao 'exato');
//   3. o texto do endereço.
// O texto é frágil: tem pedido com "Jonas burguers, S/N" no lugar da rua. Nos casos aproximado/bairro
// o texto ainda é melhor que a coord, que seria só a rua ou o portão do condomínio.
function destinoRota(p) {
  const c = (p && p.cliente) || {};
  if (p && p.gpsLat != null && p.gpsLng != null) {
    return { txt: p.gpsLat + ',' + p.gpsLng, coord: true, fonte: 'gps' };
  }
  if (p && p.geoPrecisao === 'exato' && p.geoLat != null && p.geoLng != null) {
    return { txt: p.geoLat + ',' + p.geoLng, coord: true, fonte: 'geo' };
  }
  const txt = [c.rua, c.numero, c.bairro, c.cidade || _lojaGeo.cidade, _lojaGeo.estado].filter(Boolean).join(', ');
  return { txt, coord: false, fonte: 'texto' };
}

// ORIGEM — GPS REAL do celular do motoboy.
// Duas frentes contra a rota "começar" em outra cidade:
//   1) Ao tocar num app, tentamos ABRIR O APP NATIVO (google.navigation: / comgooglemaps://
//      / maps://): o app usa o GPS do próprio aparelho, então nem precisa de origem.
//   2) Só se nenhum app abrir caímos na URL *web* — e aí SIM mandamos `origin=<GPS>`, porque
//      o Google Maps web dentro do navegador do WhatsApp não lê o GPS e, sem origem, chutaria
//      pelo IP da operadora (o tal "ponto fixo" em outra cidade).
let _rotaDest = '', _rotaDestCoord = false;

function _pegarGps(timeoutMs) {
  return new Promise(resolve => {
    // Coordenada "quente" do watchPosition (aquecido no load) — instantânea e recente.
    const quente = (typeof _gpsQuenteFresco === 'function') ? _gpsQuenteFresco() : null;
    if (quente) return resolve(quente);
    if (!navigator.geolocation) return resolve(null);
    let feito = false;
    const encerra = (v) => { if (feito) return; feito = true; resolve(v); };
    setTimeout(() => encerra(null), timeoutMs);                    // GPS lento não pode segurar a rota
    navigator.geolocation.getCurrentPosition(
      pos => encerra({ lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6) }),
      ()  => encerra(null),                                        // negou permissão ou falhou → fallback
      { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 5000 }   // fix fresco (era 60000)
    );
  });
}

function _rotaSetHrefs(origem) {
  const d = _rotaDest;
  const o = origem ? encodeURIComponent(origem.lat + ',' + origem.lng) : '';
  // URLs WEB (fallback final). Guardam origin=<GPS> — na web do WhatsApp é a única forma
  // de a rota partir do motoboy; se abrir num app nativo, o próprio app ignora a origem.
  const gWeb = 'https://www.google.com/maps/dir/?api=1&destination=' + d + (o ? '&origin=' + o : '') + '&travelmode=driving';
  // Waze só navega a partir do GPS do próprio app (não aceita origem) — usa `ll=` quando o
  // destino é coordenada (formato que ele entende) e `q=` quando é texto.
  const wWeb = 'https://waze.com/ul?' + (_rotaDestCoord ? 'll=' + d : 'q=' + d) + '&navigate=yes';
  const aWeb = 'https://maps.apple.com/?daddr=' + d + (o ? '&saddr=' + o : '') + '&dirflg=d';
  document.getElementById('rotaGoogle').href = gWeb;
  document.getElementById('rotaWaze').href   = wWeb;
  document.getElementById('rotaApple').href  = aWeb;
  // Monta as cadeias app-nativo→web (helper fora deste bloco; no teste headless nem roda).
  if (typeof _rotaMontarCadeias === 'function') _rotaMontarCadeias(d, gWeb, wWeb, aWeb);
}

function _rotaStatus(estado) {
  const el = document.getElementById('rotaStatus');
  if (!el) return;
  if (estado === 'buscando') { el.textContent = '📍 Pegando sua localização…'; el.style.color = 'var(--text2)'; }
  else if (estado === 'ok')  { el.textContent = '📍 A rota parte de onde você está'; el.style.color = 'var(--green)'; }
  else                       { el.textContent = '⚠️ Sem GPS aqui. Abrindo direto no app de mapas a rota já parte de você; se cair no navegador do WhatsApp, toque no menu (⋮ / compartilhar) → "Abrir no Chrome/Safari".'; el.style.color = '#fbbf24'; }
}

async function abrirRotaMenu(encDest, ehCoord) {
  if (!encDest) return;
  _rotaDest = encDest;
  _rotaDestCoord = !!ehCoord;

  // Abre JÁ com os links no fallback (sem origem). Se o motoboy tocar antes do GPS
  // responder, a rota abre igual — só sem a origem. Nunca trava.
  _rotaSetHrefs(null);
  _rotaStatus('buscando');
  document.getElementById('rotaSheet').classList.add('show');

  const gps = await _pegarGps(10000);
  if (!document.getElementById('rotaSheet').classList.contains('show')) return;   // fechou/abriu antes
  if (gps) { _rotaSetHrefs(gps); _rotaStatus('ok'); }
  else     { _rotaStatus('sem'); }
}
function fecharRota() { document.getElementById('rotaSheet').classList.remove('show'); }

// ── APP NATIVO PRIMEIRO (o GPS de verdade mora no app, não na WebView do WhatsApp) ──
// Detecção de plataforma só pra escolher o esquema certo (Android × iOS).
const _ua = navigator.userAgent || '';
const _isIOS = /iPad|iPhone|iPod/.test(_ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const _isAndroid = /Android/.test(_ua);
let _rotaNativo = { google: [], waze: [], apple: [] };   // cadeia ordenada por app (web é o último elo)

// Monta, por app, a cadeia [app-nativo…, web]. `d` = destino já url-encodado.
// Nos esquemas nativos NÃO vai origem: o app parte do GPS do aparelho por conta própria.
function _rotaMontarCadeias(d, gWeb, wWeb, aWeb) {
  const wNat = 'waze://?' + (_rotaDestCoord ? 'll=' + d : 'q=' + d) + '&navigate=yes';
  const aNat = 'maps://?daddr=' + d + '&dirflg=d';
  if (_isIOS)          _rotaNativo.google = ['comgooglemaps://?daddr=' + d + '&directionsmode=driving', aNat, gWeb];
  else if (_isAndroid) _rotaNativo.google = ['google.navigation:q=' + d + '&mode=d', gWeb];
  else                 _rotaNativo.google = [gWeb];
  _rotaNativo.waze  = [wNat, wWeb];
  _rotaNativo.apple = _isIOS ? [aNat, aWeb] : [aWeb];
}

// Tenta cada URI em ordem: se a página some (o app abriu) para; senão ~1,2s depois vai pra
// próxima. Ao chegar num http(s) — a web — encerra (a web sempre "abre").
function _abrirCadeia(uris) {
  if (!uris || !uris.length) return;
  let saiu = false;
  const marcar = () => { saiu = true; };
  const limpar = () => {
    document.removeEventListener('visibilitychange', marcar);
    window.removeEventListener('pagehide', marcar);
    window.removeEventListener('blur', marcar);
  };
  document.addEventListener('visibilitychange', marcar);
  window.addEventListener('pagehide', marcar);
  window.addEventListener('blur', marcar);
  let i = 0;
  const passo = () => {
    if (saiu || document.hidden || i >= uris.length) return limpar();
    const u = uris[i++];
    try { window.location.href = u; } catch (_) {}
    if (/^https?:/i.test(u)) return limpar();          // web = elo final da cadeia
    setTimeout(passo, 1200);
  };
  passo();
}

// Chamado pelos <a> da folha de rota (retorna false: quem navega é a cadeia, não o href).
function abrirApp(app) {
  const chain = (_rotaNativo && _rotaNativo[app]) ? _rotaNativo[app].slice() : [];
  fecharRota();
  if (chain.length) { _abrirCadeia(chain); }
  else {
    const el = document.getElementById(app === 'waze' ? 'rotaWaze' : app === 'apple' ? 'rotaApple' : 'rotaGoogle');
    if (el && el.href) window.location.href = el.href;   // rede de segurança: usa o href web já montado
  }
  return false;
}

// ── GPS QUENTE — aquece a localização no CARREGAMENTO, não só ao tocar "Abrir rota" ──
// watchPosition mantém uma coordenada recente pronta; quando o motoboy toca, a origem da web
// já sai instantânea (e a permissão foi pedida assim que ele abriu a página).
let _gpsQuente = null, _gpsWatchId = null;
function _iniciarGpsQuente() {
  if (!navigator.geolocation || _gpsWatchId != null) return;
  try {
    _gpsWatchId = navigator.geolocation.watchPosition(
      pos => { _gpsQuente = { lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), ts: Date.now() }; },
      ()  => {},                                             // negou/sem sinal → segue no fallback ao abrir a rota
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 15000 }
    );
  } catch (_) {}
}
// Só serve a coordenada se for recente (≤30s) — nada de fix velho como no maximumAge:60000 de antes.
function _gpsQuenteFresco() {
  if (!_gpsQuente) return null;
  if (Date.now() - _gpsQuente.ts > 30000) return null;
  return { lat: _gpsQuente.lat, lng: _gpsQuente.lng };
}

function render(lista) {
  _ultimaLista = lista;
  if (!lista.length) {
    $('conteudo').innerHTML = `<div class="estado"><div class="big">🎉</div><div>Nenhuma entrega no momento.</div><div style="font-size:13px;color:var(--text3);margin-top:8px">Os pedidos atribuídos a você aparecem aqui na hora.</div></div>`;
    return;
  }
  $('conteudo').innerHTML = lista.map(p => {
    const c = p.cliente || {};
    const emRota = p.status === 'entregue';                 // 'entregue' (Fase 2) = saiu p/ entrega
    const pill = emRota ? `<span class="pill pill-rota">Em rota</span>` : `<span class="pill pill-fila">Na fila</span>`;
    const itens = (p.itens || []).map(i => `${i.qty || i.qtd || 1}× ${esc(i.nome || '')}`).join('<br>');
    // 99Food: o que cobrar na porta é o "falta pagar" do roteiro (customer_need_paying_money → food99Precos.faltaPagar)
    const falta99 = p.origem === '99food' && p.pagamento !== '99food' && p.food99Precos && p.food99Precos.faltaPagar != null && isFinite(Number(p.food99Precos.faltaPagar))
      ? Number(p.food99Precos.faltaPagar) : null;
    const total = 'R$ ' + Number(falta99 != null ? falta99 : (p.total || 0)).toFixed(2).replace('.', ',');
    // Pix NA ENTREGA (a receber): a forma trocada no painel (pagamentoManual), o Pix OFFLINE do iFood (o joey-ifood só
    // grava 'pix' quando o iFood manda cobrar na entrega) ou o Pix da 99 (o online vem como '99food'). "Pix · pago" fica
    // para o Pix online do cardápio — e vale antes de tudo quando o webhook confirmou (pixStatus 'pago': o cliente pagou o
    // QR mesmo depois da troca). O aviso de WhatsApp do painel (_pagamentoMotoboy) segue esta mesma regra.
    const pixReceber = p.pagamento === 'pix' && p.pixStatus !== 'pago' && (p.pagamentoManual === true || (p.origem === 'ifood' && !!p.ifoodOrderId) || p.origem === '99food');
    const pix = p.pagamento === 'pix' && !pixReceber;
    const trocoTxt = (p.pagamento === 'dinheiro' && p.troco) ? ` · troco p/ R$ ${Number(p.troco).toFixed(2).replace('.', ',')}` : '';
    const cartao = p.pagamento === 'cartao' || p.pagamento === 'credito' || p.pagamento === 'debito';
    const pagHtml = p.pagamento === 'ifood'                     // pago online no app do iFood: nada a receber
      ? `<span class="pago">📱 Pago no iFood</span>`
      : p.pagamento === '99food'                                // pago online no app da 99: nada a receber
      ? `<span class="pago">📱 Pago na 99</span>`
      : pixReceber
      ? `<span class="receber">📱 Pix na entrega · receber</span>`
      : pix
      ? `<span class="pago">📱 Pix · pago</span>`
      : `<span class="receber">${cartao ? '💳 Cartão na entrega' : '💵 Dinheiro' + trocoTxt} · receber</span>`;
    const tel = (c.tel || '').replace(/\D/g, '');
    const _dr = destinoRota(p);        // coord (se o Google achou a casa) ou texto do endereço
    return `<div class="card">
      <div class="card-top"><span class="num">#${esc(p.id)}</span>${pill}</div>
      ${p.origem === 'ifood' ? `<div class="ifood-tag">iFood${p.ifoodDisplayId ? ' #' + esc(p.ifoodDisplayId) : ''}</div>` : ''}
      ${p.origem === '99food' ? `<div class="tag99">99Food${p.food99OrderIndex != null ? ' #' + esc(p.food99OrderIndex) : ''}</div>` : ''}
      <div class="cli">${esc(c.nome || '—')}</div>
      ${tel ? `<a class="tel" href="tel:${tel}">📞 ${esc(c.tel)}</a>` : ''}
      ${localizador99Html(p)}
      <div class="end">📍 ${esc(enderecoTxt(c)) || '—'}${c.ref ? `<br><span class="ref">Ref: ${esc(c.ref)}</span>` : ''}${c.complemento ? `<br>${esc(c.complemento)}` : ''}</div>
      ${_dr.fonte === 'gps' ? `<div class="gps-cli">📡 Localização enviada pelo cliente${p.gpsPrecisaoM ? ` (±${Number(p.gpsPrecisaoM)} m)` : ''} — a rota vai direto ao ponto dele</div>` : ''}
      <div class="itens">${itens || '—'}</div>
      <div class="pag">${pagHtml}<span class="total">${total}</span></div>
      <div class="btns">
        <button class="btn btn-rota" data-dest="${esc(encodeURIComponent(_dr.txt))}" data-coord="${_dr.coord ? '1' : ''}" onclick="abrirRotaMenu(this.dataset.dest, !!this.dataset.coord)">🗺️ Abrir rota</button>
        ${pedeCodigo(p) ? '' : `<button class="btn btn-ok" data-pid="${esc(p.id)}" onclick="entreguei(this.dataset.pid, this)">✅ Entreguei</button>`}
      </div>
      ${pedeCodigo(p) ? codigoHtml(p) : ''}
    </div>`;
  }).join('');
  refocarCodigo();
}

// ── Código de entrega do iFood ─────────────────────────────────────────────────────────────────
// Pedido do iFood com entrega PRÓPRIA não tem "Entreguei": o motoboy pede o código ao cliente (ele vê
// no app do iFood) e o iFood valida. Só com o iFood aceitando o pedido conclui — quem grava
// finalizado é o serviço; o card some pelo onSnapshot. Erro fica escrito no card (sem alert).
// O que foi digitado sobrevive ao re-render do onSnapshot.
const _cod = { valor: {}, erro: {}, ocupado: new Set(), foco: null };
let _ultimaLista = [];
function pedeCodigo(p) {
  return (p.origem === 'ifood' && !!p.ifoodOrderId && p.ifoodTipo === 'DELIVERY' && p.ifoodEntregaPor === 'MERCHANT')
    || eh99Propria(p);
}
// 99Food, entrega PRÓPRIA (food99TipoEntrega 2): o cliente vê o código no app da 99; a 99 valida pelo serviço.
function eh99Propria(p) {
  return p.origem === '99food' && !!p.food99OrderId && Number(p.food99TipoEntrega) === 2 && p.food99Retirada !== true;
}
const nomePlataforma = (p) => (eh99Propria(p) ? 'da 99' : 'do iFood');
// Localizador da 99 (entrega PRÓPRIA, roteiro da 99): o telefone do cliente é VIRTUAL — liga e informa o localizador;
// a página de entrega da 99 também conclui a entrega com o código do cliente.
function localizador99Html(p) {
  const l = eh99Propria(p) && p.food99Localizador;
  if (!l || !(l.telefone || l.localizador)) return '';
  const tel = String(l.telefone || '').replace(/[^\d+]/g, '');
  const link = /^https:\/\//.test(l.link || '') ? l.link : '';
  return `<div class="loc99">📞 Cliente pela 99: ${tel ? `<a href="tel:${esc(tel)}">${esc(l.telefone)}</a>` : '—'}`
    + (l.localizador ? `<br>Informe o localizador <b>${esc(l.localizador)}</b>` : '')
    + (link ? `<br><a href="${esc(link)}" target="_blank" rel="noopener">Página de entrega da 99 ›</a>` : '') + '</div>';
}
function codigoHtml(p) {
  const id = esc(p.id);
  const ocupado = _cod.ocupado.has(p.id);
  const erro = _cod.erro[p.id];
  return `<div class="cod">
    <input id="cod_${id}" data-pid="${id}" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Código de entrega"
      value="${esc(_cod.valor[p.id] || '')}" ${ocupado ? 'disabled' : ''}
      oninput="_cod.valor[this.dataset.pid]=this.value" onfocus="_cod.foco=this.dataset.pid" onblur="if(this.isConnected&&_cod.foco===this.dataset.pid)_cod.foco=null"
      onkeydown="if(event.key==='Enter'){event.preventDefault();validarCodigo(this.dataset.pid)}">
    <button class="btn ${eh99Propria(p) ? 'btn-99' : 'btn-ifood'}" data-pid="${id}" ${ocupado ? 'disabled' : ''} onclick="validarCodigo(this.dataset.pid)">${ocupado ? (eh99Propria(p) ? '⏳ Validando na 99…' : '⏳ Validando no iFood…') : '✅ Validar e entregar'}</button>
    ${erro ? `<div class="erro">⚠️ ${esc(erro)}</div>` : `<div class="dica">Peça ao cliente o código de entrega que aparece no app ${nomePlataforma(p)}.</div>`}
  </div>`;
}
function refocarCodigo() {
  const el = _cod.foco && document.getElementById('cod_' + _cod.foco);
  if (el && document.activeElement !== el && !el.disabled) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (_) {} }
}
async function validarCodigo(id) {
  if (_cod.ocupado.has(id)) return;
  const codigo = String(_cod.valor[id] || '').replace(/\D/g, '');
  const ped = _ultimaLista.find(x => x.id === id) || {};
  const de99 = eh99Propria(ped);
  if (codigo.length < 4) { _cod.erro[id] = 'Digite o código que o cliente vê no app ' + nomePlataforma(ped) + '.'; render(_ultimaLista); return; }
  _cod.erro[id] = null;
  _cod.foco = null;
  _cod.ocupado.add(id);
  render(_ultimaLista);
  try {
    const u = auth.currentUser;
    if (!u) throw new Error('Sessão expirada. Abra o link de novo.');
    let resp;
    try {
      resp = await fetch(`${IFOOD_API}${de99 ? '/99food' : ''}/pedidos/${encodeURIComponent(tenant)}/${encodeURIComponent(id)}/codigo-entrega`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + await u.getIdToken(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo }),
      });
    } catch (_) { throw new Error((de99 ? 'Sem conexão com a 99' : 'Sem conexão com o iFood') + ' agora. Confira a internet e tente de novo.'); }
    let j = {};
    try { j = await resp.json(); } catch (_) {}
    if (!resp.ok || !j.ok) throw new Error(j.erro || ('Erro ' + resp.status + (de99 ? ' ao validar na 99.' : ' ao validar no iFood.')));
    delete _cod.valor[id];
    // sucesso: o serviço marcou o pedido como entregue → o onSnapshot tira o card
  } catch (e) {
    _cod.erro[id] = e.message;
  } finally {
    _cod.ocupado.delete(id);
    render(_ultimaLista);
  }
}

async function entreguei(id, btn) {
  if (!confirm('Confirmar que o pedido #' + id + ' foi entregue?')) return;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Salvando…'; }
  try {
    await db.collection('clientes/' + tenant + '/pedidos').doc(id).update({
      status: 'finalizado',
      entregueEm: firebase.firestore.FieldValue.serverTimestamp(),
    });
    // o onSnapshot remove o card automaticamente (status saiu de ativo)
  } catch (e) {
    alert('Não consegui marcar como entregue. Tente de novo.');
    if (btn) { btn.disabled = false; btn.textContent = '✅ Entreguei'; }
  }
}

_iniciarGpsQuente();   // pede a localização já no load (permissão + coordenada quente)
init();
</script>
</body>
